<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工艺智能问答 RAG 系统</title>
  <link rel="stylesheet" href="vendor/element-plus.css" />
  <script src="vendor/vue.global.js"></script>
  <script src="vendor/element-plus.full.min.js"></script>
  <script src="vendor/element-plus-icons.iife.min.js"></script>
  <!-- Tailwind Play CDN removed on purpose: this page contains zero Tailwind utility classes
       (171 static class attrs + 22 :class bindings checked), preflight was already disabled,
       and the custom stylesheet provides its own box-sizing reset. Removing it keeps the
       visuals identical while making the page fully offline-capable. -->
  <style>
    :root{
      --wb-navy:#0f2c5c; --wb-navy2:#163a73; --wb-blue:#1d4ed8; --wb-blue2:#3b82f6;
      --wb-side:#1d5fe8; --wb-side-hover:#3b7bf0;   /* 导航栏蓝色（较浅） */
      --wb-bg:#f0f2f5; --wb-line:#e3e8ef; --wb-text:#1f2733; --wb-sub:#6b7785;
      --wb-red:#f5222d; --wb-yellow:#faad14; --wb-green:#52c41a;
      /* 上下文超时预警专用：浅橙，仅用于柔和提示，不使用强阻断红色 */
      --wb-warn:#d46b08; --wb-warn-bg:#fff7e6; --wb-warn-line:#ffd591;
      /* 密度契约：主区内边距 / 区块间距 / 卡片内边距，平板与矮屏统一收紧 */
      --wb-main-pad:18px; --wb-gap:14px; --wb-card-pad:14px;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; margin:0; }
    body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--wb-bg); color:var(--wb-text); letter-spacing:0; }
    #app{ height:100vh; }
    .wb-side{ background:var(--wb-side); }
    .wb-side .el-menu{ background:transparent; border-right:none; }
    .wb-side .el-menu-item{ color:#e8f0ff; height:50px; line-height:50px; }
    .wb-side .el-menu-item.is-active{ background:#fff; color:var(--wb-side); font-weight:700; }
    .wb-side .el-menu-item:hover{ background:var(--wb-side-hover); color:#fff; }
    .wb-logo{ color:#fff; padding:18px 20px; font-weight:800; font-size:19px; letter-spacing:.5px; border-bottom:1px solid rgba(255,255,255,.18); }
    .wb-logo small{ display:block; font-weight:400; font-size:11px; color:#cfe0ff; margin-top:4px; letter-spacing:.5px; }
    @keyframes wbBlink { 0%,100%{opacity:1} 50%{opacity:.4} }
    .wb-blink{ animation:wbBlink 1.1s ease-in-out infinite; }
    @keyframes wbPulse { 0%{background:#fff7e6} 50%{background:#ffe7ba} 100%{background:#fff7e6} }
    .wb-row-hl td{ animation:wbPulse 1.3s ease-in-out infinite; }
    .wb-header{ background:#fff; border-bottom:1px solid var(--wb-line); display:flex; align-items:center; justify-content:space-between; padding:0 16px; height:56px; }
    .wb-main{ padding:var(--wb-main-pad); overflow:auto; height:calc(100vh - 56px); }
    .wb-head-left{ display:flex; align-items:center; gap:10px; min-width:0; }
    .wb-head-right{ display:flex; align-items:center; gap:14px; flex-shrink:0; }
    .wb-head-title{ font-weight:700; font-size:16px; white-space:nowrap; }
    .wb-logo-mini{ color:#fff; padding:18px 0; font-weight:800; font-size:15px; text-align:center; letter-spacing:1px; border-bottom:1px solid rgba(255,255,255,.18); }
    .wb-crumb{ font-size:13px; }
    .wb-crumb-link{ color:var(--wb-blue); cursor:pointer; text-decoration:none; }
    .wb-crumb-link:hover{ text-decoration:underline; }
    .wb-crumb-cur{ color:var(--wb-sub); font-weight:600; }
    /* 时间列表头排序三角（原生 B 端 caret 风格） */
    .wb-th-sort{ display:inline-flex; align-items:center; gap:4px; cursor:pointer; user-select:none; padding:10px 2px; margin:-10px -2px; min-height:40px; outline:none; }
    .wb-th-sort:hover{ color:var(--wb-blue); }
    .wb-th-sort:focus-visible{ outline:2px solid var(--wb-blue); outline-offset:-2px; border-radius:4px; }
    .wb-sort-caret{ display:inline-flex; flex-direction:column; gap:2px; width:9px; }
    .wb-sort-caret i{ width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent; }
    .wb-sort-caret i.up{ border-bottom:5px solid #c0c4cc; }
    .wb-sort-caret i.down{ border-top:5px solid #c0c4cc; }
    .wb-sort-caret.desc i.down{ border-top-color:var(--wb-blue); }
    .wb-sort-caret.asc  i.up{ border-bottom-color:var(--wb-blue); }
    /* ===== 自适应：窄屏(≤1024)侧栏改为可滑出抽屉，顶栏收起次要信息 ===== */
    .wb-side-mask{ display:none; }
    @media (max-width:1024px){
      .wb-side{ position:fixed; top:0; left:0; bottom:0; z-index:1001; transform:translateX(-100%); transition:transform .25s ease; box-shadow:2px 0 12px rgba(0,0,0,.18); }
      .wb-side.wb-side-open{ transform:translateX(0); }
      .wb-side-mask{ display:block; position:fixed; inset:0; background:rgba(15,44,92,.35); z-index:1000; }
      .wb-hide-narrow{ display:none !important; }
      .wb-head-title{ font-size:15px; }
      .wb-main{ padding:var(--wb-main-pad); }
    }
    /* ===== 自适应：极小屏(≤768)登录页改为单列堆叠 ===== */
    @media (max-width:768px){
      .login-box{ flex-direction:column; max-width:96vw; }
      .login-left{ display:none; }
      .login-right{ flex:1; padding:28px 22px; }
    }
    .wb-card{ background:#fff; border:1px solid var(--wb-line); border-radius:10px; }
    .risk-bar{ height:6px; border-radius:4px; transition:background .3s; }
    .param-red{ color:var(--wb-red); font-weight:700; }
    .tag-low{ background:#e6f7e6; color:#389e0d; border:1px solid #b7eb8f; }
    .tag-mid{ background:#fff7e6; color:#d48806; border:1px solid #ffd591; }
    .tag-high{ background:#fff1f0; color:#cf1322; border:1px solid #ffa39e; }
    /* ===== 问答页：占满可视高度，消息区内部滚动，输入区常驻底部 ===== */
    .wb-qa{ height:100%; min-height:0; display:flex; flex-direction:column; gap:var(--wb-gap); }
    .wb-qa-top{ flex:0 0 auto; padding:12px 16px; }
    .wb-qa-body{ flex:1 1 auto; min-height:0; display:flex; gap:var(--wb-gap); align-items:stretch; }
    .wb-chat-card{ flex:1 1 auto; min-width:0; min-height:0; padding:var(--wb-card-pad); display:flex; flex-direction:column; }
    /* 上下文状态栏：标题 + 字段 / 空态文案 + 清空按钮同处一行，纵向收紧为窄条 */
    .wb-ctx-bar{ flex:0 0 auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
      background:#f7f9fc; border:1px solid var(--wb-line); border-radius:8px; padding:6px 10px; margin-bottom:10px; }
    .wb-ctx-title{ font-weight:700; font-size:13px; line-height:24px; white-space:nowrap; flex:0 0 auto; }
    .wb-ctx-empty{ flex:1 1 auto; min-width:0; line-height:24px; }
    .wb-ctx-clear{ margin-left:auto; flex:0 0 auto; }
    .wb-chat{ flex:1 1 auto; min-height:0; height:auto; overflow:auto; padding:10px 4px; }
    .wb-composer{ flex:0 0 auto; display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
    /* flex-basis:0 覆盖 el-input 默认 width:100%，避免把三个按钮挤到第二行 */
    .wb-composer .el-input{ flex:1 1 0%; width:auto; min-width:180px; }
    .wb-composer .wb-btn-last{ margin-left:auto; }
    @media (max-width:768px){ .wb-composer .el-button{ min-height:44px; } }
    .wb-side-col{ flex:0 0 300px; width:300px; min-height:0; display:flex; flex-direction:column; gap:var(--wb-gap); overflow:hidden; }
    .wb-sess-card{ flex:0 0 auto; padding:var(--wb-card-pad); }
    /* 演示案例库吃掉侧栏剩余高度并内部滚动：会话列表增减都不会把它整块挤出视口 */
    .wb-case-card{ flex:1 1 auto; width:auto; min-height:0; overflow:auto; padding:var(--wb-card-pad); }
    /* ===== 平板 / 矮屏：收紧纵向密度，一屏内完整看到输入区 ===== */
    @media (max-height:900px), (max-width:1024px){
      :root{ --wb-main-pad:10px; --wb-gap:10px; --wb-card-pad:10px; }
      .wb-qa-top{ padding:8px 12px; }
      .wb-ctx-bar{ padding:5px 8px; margin-bottom:6px; }
      .wb-chat{ padding:6px 4px; }
      .wb-bubble{ padding:8px 12px; margin-bottom:8px; }
      .wb-composer{ margin-top:6px; }
      .wb-side-col{ flex-basis:280px; width:280px; }
      .wb-section-title{ margin-bottom:8px; }
    }
    .wb-bubble{ max-width:76%; padding:10px 14px; border-radius:10px; margin-bottom:12px; line-height:1.6; font-size:14px; white-space:pre-wrap; word-break:break-word; }
    .wb-bubble.user{ background:var(--wb-blue); color:#fff; margin-left:auto; border-bottom-right-radius:2px; }
    .wb-bubble.bot{ background:#f4f7fb; border:1px solid var(--wb-line); margin-right:auto; border-bottom-left-radius:2px; }
    .wb-bubble.sys{ background:#fffbe6; border:1px solid #ffe58f; color:#ad6800; margin:0 auto 12px; max-width:90%; text-align:center; font-size:13px; }
    .wb-ctx-warn{ background:var(--wb-warn-bg); border:1px solid var(--wb-warn-line); color:var(--wb-warn);
      border-radius:6px; padding:8px 10px; margin:0 auto 12px; max-width:90%; font-size:12px; line-height:1.6; }
    /* ===== 分级追问风控：柔和前置提醒 / 上限按钮 / 会话列表【风险会话】标签 ===== */
    .wb-follow-warn{ background:var(--wb-warn-bg); border:1px solid var(--wb-warn-line); color:var(--wb-warn);
      border-radius:8px; padding:10px 12px; margin:0 auto 12px; max-width:90%; font-size:13px; line-height:1.7; }
    .wb-follow-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .wb-follow-actions .wb-btn-warn{ background:#fff; border-color:var(--wb-warn-line); color:var(--wb-warn); }
    .wb-follow-actions .wb-btn-warn:hover{ background:#ffe7ba; border-color:var(--wb-warn); color:var(--wb-warn); }
    @media (max-width:768px){ .wb-follow-actions .el-button{ min-height:44px; } }
    .wb-ctx-bar .wb-context-chip{ margin:0; }
    .wb-risk-tag{ background:var(--wb-warn-bg); color:var(--wb-warn); border:1px solid var(--wb-warn-line);
      font-size:11px; line-height:18px; padding:0 6px; border-radius:4px; white-space:nowrap; flex:0 0 auto; }
    .wb-sess-list{ display:flex; flex-direction:column; gap:6px; }
    .wb-sess-item{ border:1px solid var(--wb-line); border-radius:8px; padding:6px 9px; background:#fff; }
    .wb-sess-item.is-active{ border-color:#adc6ff; background:#f7faff; }
    .wb-sess-head{ display:flex; align-items:center; gap:6px; }
    .wb-sess-title{ font-size:13px; font-weight:600; flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .wb-sess-meta{ font-size:11px; color:var(--wb-sub); margin-top:3px; }
    /* 演示案例卡片：单行收紧，完整描述保留在 title 悬浮提示中。
       用 .wb-case-card 前缀提高优先级，避免被后面的 .role-card / .wb-tip 覆盖。 */
    .wb-case-card .wb-case-item{ margin-bottom:8px; padding:6px 9px; border-width:1px; }
    .wb-case-card .wb-case-name{ font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .wb-case-card .wb-case-desc{ margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .wb-case-card .wb-case-tip{ font-size:11px; line-height:1.5; padding:8px 10px; }
    /* ===== 站内通知 / 内置问卷（低频浮层：沿用工业蓝主色，仅未读红点用 --wb-red）===== */
    .wb-notice-wrap{ position:relative; flex:0 0 auto; }
    .wb-notice-bell .el-button{ min-width:32px; min-height:32px; }
    .wb-notice-panel{ position:absolute; right:0; top:40px; width:360px; max-height:520px; overflow:auto;
      background:#fff; border:1px solid var(--wb-line); border-radius:8px; padding:12px;
      box-shadow:0 8px 28px rgba(15,44,92,.16); z-index:2000; }
    .wb-notice-head{ display:flex; align-items:center; gap:10px; padding-bottom:10px; border-bottom:1px solid var(--wb-line); }
    .wb-notice-head b{ font-size:14px; }
    .wb-notice-head .el-button{ margin-left:auto; }
    .wb-notice-empty{ padding:24px 0; text-align:center; color:var(--wb-sub); font-size:12px; }
    .wb-notice-card{ border:1px solid var(--wb-line); border-radius:8px; padding:10px 12px; margin-top:10px; background:#fff; }
    .wb-notice-card.is-unread{ border-color:#adc6ff; background:#f7faff; }
    .wb-notice-card.is-done{ background:#fafbfc; }
    .wb-notice-line{ display:flex; align-items:center; gap:6px; }
    .wb-notice-dot{ width:8px; height:8px; border-radius:50%; background:var(--wb-red); flex:0 0 auto; }
    .wb-notice-title{ font-size:13px; font-weight:600; flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .wb-notice-done{ font-size:11px; color:var(--wb-green); background:#e6f7e6; border:1px solid #b7eb8f; border-radius:4px; padding:0 6px; line-height:18px; flex:0 0 auto; }
    .wb-notice-body{ margin-top:6px; line-height:1.6; }
    .wb-notice-time{ margin-top:4px; }
    .wb-notice-actions{ display:flex; align-items:center; gap:8px; margin-top:10px; }
    .wb-notice-alert{ display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer;
      margin-top:12px; padding-top:10px; border-top:1px dashed var(--wb-line); font-size:12px; color:var(--wb-sub); }
    .wb-notice-alert:hover{ color:var(--wb-blue); }
    /* 问卷：居中模态，半透明遮罩由 el-dialog 的 modal-class 提供 */
    .wb-survey-overlay{ background-color:rgba(15,23,42,.45); }
    .wb-survey-q{ margin-bottom:18px; }
    .wb-survey-label{ font-size:13px; font-weight:600; margin-bottom:10px; }
    .wb-survey-req{ font-size:11px; font-weight:400; color:var(--wb-red); margin-left:6px; }
    .wb-survey .el-radio-group{ display:flex; flex-wrap:wrap; gap:8px 16px; }
    /* 问卷顶部说明小字：克制、不抢标题 */
    .wb-survey-note{ font-size:12px; line-height:1.7; color:var(--wb-sub); margin:-4px 0 16px; }
    /* 运营后台 · 问卷结果面板 */
    .wb-res-row{ display:flex; align-items:center; gap:10px; margin-bottom:9px; }
    .wb-res-label{ flex:0 0 88px; font-size:12px; color:var(--wb-text); }
    .wb-res-bar{ flex:1 1 auto; height:10px; border-radius:5px; background:#eef2f8; overflow:hidden; }
    .wb-res-bar > div{ display:block; height:100%; background:var(--wb-blue); border-radius:5px; }
    .wb-res-num{ flex:0 0 54px; text-align:right; font-size:12px; color:var(--wb-sub); }
    .wb-res-comment{ border:1px solid var(--wb-line); border-radius:8px; padding:9px 11px; margin-bottom:8px; font-size:13px; line-height:1.7; }
    .wb-res-comment .wb-mini{ margin-bottom:4px; }
    @media (max-width:768px){ .wb-res-label{ flex-basis:72px; } }
    /* 看板新增静态指标卡：与 .wb-stat 同风格、同高度，不暗示可点击 */
    .wb-stat-static{ min-height:76px; }
    @media (max-width:640px){
      .wb-notice-panel{ width:min(360px, calc(100vw - 32px)); right:-40px; }
      .wb-survey-dialog{ width:calc(100vw - 32px)!important; }   /* 窄屏仍非全屏 */
      .wb-notice-actions .el-button{ min-height:44px; }
    }
    @media (max-width:768px){ .wb-notice-bell .el-button{ min-width:44px; min-height:44px; } }

    /* ===== 会话存档详情：逐条完整聊天记录 ===== */
    .wb-arc-meta{ display:flex; flex-wrap:wrap; gap:8px 18px; font-size:12px; color:var(--wb-sub);
      background:#f7f9fc; border:1px solid var(--wb-line); border-radius:8px; padding:10px 12px; }
    .wb-arc-meta b{ color:var(--wb-text); font-weight:600; }
    .wb-archive-log{ max-height:46vh; min-height:120px; overflow:auto; padding:6px 10px 10px;
      border:1px solid var(--wb-line); border-radius:8px; background:#fff; }
    .wb-archive-log .wb-bubble{ max-width:92%; }
    .wb-arc-row{ margin-bottom:8px; }
    .wb-arc-idx{ font-size:11px; color:var(--wb-sub); margin:0 0 4px 2px; }
    .wb-mini{ font-size:12px; color:var(--wb-sub); }
    .wb-section-title{ font-size:15px; font-weight:700; margin:0 0 12px; display:flex; align-items:center; gap:8px; }
    .wb-demo-tag{ background:#f0f5ff; color:var(--wb-blue); border:1px solid #adc6ff; font-size:11px; padding:1px 6px; border-radius:4px; }
    .wb-context-chip{ display:inline-flex; align-items:center; gap:6px; background:#eef2ff; color:#2f54eb; border:1px solid #d6e4ff; padding:3px 10px; border-radius:14px; font-size:12px; margin:0 6px 6px 0; }
    .wb-context-chip b{ color:#1d39c4; }
    /* ===== AI 回答底部 · 溯源来源（浅灰小字区块，与回答正文分层） ===== */
    .wb-src{ margin-top:10px; padding:8px 10px; background:#f5f6f8; border:1px solid var(--wb-line);
      border-left:3px solid #c9d6e8; border-radius:6px; font-size:12px; color:var(--wb-sub);
      line-height:1.6; white-space:normal; }
    .wb-src-head{ display:flex; align-items:center; justify-content:space-between; gap:8px;
      font-size:11px; color:#6b7785; margin-bottom:4px; }
    .wb-src-item{ padding:5px 0; }
    .wb-src-item + .wb-src-item{ border-top:1px dashed #dfe4ec; }
    .wb-src-title{ color:var(--wb-blue); font-weight:600; text-decoration:none; cursor:pointer; }
    .wb-src-title:hover{ text-decoration:underline; }
    .wb-src-title:focus-visible{ outline:2px solid var(--wb-blue); outline-offset:2px; border-radius:2px; }
    .wb-src-meta{ color:#6b7785; font-weight:400; }
    .wb-src-snippet{ margin-top:2px; color:#4e5969; font-size:12px;
      display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    .wb-src-empty{ color:#6b7785; font-size:12px; }
    .wb-src-more{ display:inline-flex; align-items:center; gap:5px; min-height:32px; padding:4px 2px; margin-top:2px;
      background:none; border:0; color:var(--wb-blue); font-size:12px; cursor:pointer; }
    .wb-src-more:hover{ text-decoration:underline; }
    .wb-src-more:focus-visible{ outline:2px solid var(--wb-blue); outline-offset:-2px; border-radius:4px; }
    .wb-src-caret{ width:0; height:0; border-left:4px solid transparent; border-right:4px solid transparent;
      border-top:5px solid var(--wb-blue); }
    .wb-src-caret.up{ border-top:0; border-bottom:5px solid var(--wb-blue); }
    /* 窄屏：扩大链接触摸热区（负 margin 抵消内边距，不改变行高与视觉） */
    @media (max-width:768px){ .wb-src-more{ min-height:44px; } .wb-src-title{ display:inline-block; padding:8px 2px; margin:-8px -2px; } }
    /* ===== 点赞踩统一反馈：气泡右下角；仅正式工艺回答高亮，其余 3 类弱化但始终可点击 =====
       弱化 = 浅灰 + 尺寸略小 + 不突出，不等于禁用：默认保持可读灰度，悬停/选中给出明确反馈。
       二级面板内联在消息区内部（非模态浮层），因此永远不会盖住底部对话输入框。 */
    .wb-fb{ margin-top:8px; display:flex; flex-direction:column; align-items:flex-end; white-space:normal; text-align:left; }
    .wb-fb-row{ display:flex; align-items:center; gap:4px; }
    .wb-fb-btn{ display:inline-flex; align-items:center; justify-content:center; width:28px; height:26px;
      padding:0; border:1px solid transparent; border-radius:5px; background:transparent;
      font-size:15px; line-height:1; cursor:pointer; opacity:.92; }
    .wb-fb-btn:hover{ background:#e8effc; border-color:#c6d8ff; opacity:1; }
    .wb-fb-btn:active{ transform:translateY(1px); }
    .wb-fb-btn:focus-visible{ outline:2px solid var(--wb-blue); outline-offset:1px; }
    .wb-fb-btn.up{ background:#e6f7e6; border-color:#b7eb8f; }
    .wb-fb-btn.down{ background:#fff1f0; border-color:#ffa39e; }
    .wb-fb.is-weak .wb-fb-btn{ width:24px; height:22px; font-size:12px; opacity:.62; filter:grayscale(1); }
    .wb-fb.is-weak .wb-fb-btn:hover{ opacity:1; filter:grayscale(.3); background:#eef3fa; border-color:#c9d6e6; }

/* ========================= 分级追问风控 · 规则常量 =========================
   高危调参场景严格限定为以下 5 类；单纯不良现象 / 故障诱因 / SOP 流程科普等低风险咨询不限制轮次。
   风险等级与语义链路由 classifyRisk() 按显式术语表自动判定，用户只需输入问题、无需选择类型；
   状态机只接收判定结果并做链路标识相等比较，不参与语义识别。 */
const HIGH_RISK_TOPICS = ['工艺窗口','设备阈值','调参方案','禁限工艺','制程变更'];
const LOW_RISK_TOPIC   = '低风险咨询';
const FOLLOW_LIMIT     = 3;                 // 单链路最多 3 轮连续追问
const FOLLOW_WARN_AT   = 2;                 // 第 2 轮结束时柔和前置提醒

/* ---- 语义自动判定（后台规则在原型内的确定性实现）----
   仅按显式术语表做「包含」判定并映射到 5 类枚举，不调用模型、不做相似度 / 意图推断。
   链路主体取提问中按固定词表首个命中的工艺对象：同类别 + 同主体 = 延续同一诉求；
   类别或主体变化 = 全新独立链路；未命中任何高危术语 = 低风险咨询。 */
const RISK_TERMS = {
  '工艺窗口': ['工艺窗口','窗口上限','窗口下限','规格窗口','放宽窗口','窗口范围'],
  '设备阈值': ['设备阈值','阈值','报警阈值','设定上限','设定下限'],
  '调参方案': ['调参','调整参数','参数方案','推演','阶梯','试做','参数优化','怎么调','上调','放宽到'],
  '禁限工艺': ['禁限工艺','禁用工艺','禁止使用','限制工艺','受限工艺','禁用材料'],
  '制程变更': ['制程变更','工艺变更','ECN','变更单','换线','工艺路线']
};
const CHAIN_ENTITIES = ['Array','CF','Cell','P55','M32','曝光能量','烤箱温度','膜厚','涂布','蚀刻','显影','色偏','Mura'];
function classifyRisk(text){
  const t = String(text||'');
  let topic = LOW_RISK_TOPIC;
  for(let i=0;i<HIGH_RISK_TOPICS.length;i++){
    const k = HIGH_RISK_TOPICS[i];
    if(RISK_TERMS[k].some(w=>t.indexOf(w)>=0)){ topic=k; break; }
  }
  if(topic===LOW_RISK_TOPIC) return { topic, chain:'' };
  let ent = '通用';
  for(let j=0;j<CHAIN_ENTITIES.length;j++){
    if(t.indexOf(CHAIN_ENTITIES[j])>=0){ ent=CHAIN_ENTITIES[j]; break; }
  }
  return { topic, chain:ent };
}

/* 表格时间列排序：兼容 '2026-03-18 09:10' 与 '2026/11/5 17:20:18' 两种日期格式 */
function tsVal(s){
  if(!s) return 0;
  const p = String(s).match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})(?:[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
  if(!p) return 0;
  return new Date(+p[1], +p[2]-1, +p[3], +(p[4]||0), +(p[5]||0), +(p[6]||0)).getTime();
}
/* 受控表格时间排序：按表格 key 隔离状态，默认倒序；点击表头三角在 倒序/正序 两态间切换 */
const TABLE_SORT = reactive({
  archive:'desc', audit:'desc', docs:'desc', pool:'desc', mine:'desc'
});
function sortDir(key){ return TABLE_SORT[key] || 'desc'; }                 // 打开页面默认倒序
function toggleTableSort(key){ TABLE_SORT[key] = sortDir(key)==='desc' ? 'asc' : 'desc'; }
function sorted(list, key, prop){
  const dir = sortDir(key)==='asc' ? 1 : -1;
  return (list||[]).slice().sort((a,b)=> dir * (tsVal(a&&a[prop]) - tsVal(b&&b[prop])));
}
function resetTableSort(){ Object.keys(TABLE_SORT).forEach(k=> TABLE_SORT[k]='desc'); }  // 每次进入页面：时间列恢复默认倒序
/* 时间列表头：label + 上下三角图标（原生 B 端风格），点击切换排序方向 */
const TimeSortHeader = {
  props: { label:String, sortKey:String },
  template:`
    <span class="wb-th-sort" @click="toggle" @keyup.enter="toggle" @keyup.space.prevent="toggle"
          tabindex="0" role="button" :aria-label="label+'排序，当前'+dirText+'，点击切换'" :title="'点击切换排序（当前：'+dirText+'）'">
      <span>{{label}}</span>
      <span class="wb-sort-caret" :class="dir"><i class="up"></i><i class="down"></i></span>
    </span>`,
  setup(props){
    const dir = computed(()=> sortDir(props.sortKey));
    const dirText = computed(()=> dir.value==='desc' ? '时间倒序（新→旧）' : '时间正序（旧→新）');
    function toggle(){ toggleTableSort(props.sortKey); }
    return { dir, dirText, toggle };
  }
};

/* ===== 上下文超时风控（严格按业务规则，不新增判定、不调用模型）=====
   计时口径：最后一条新消息起算；默认 30 分钟，可配 20 / 30；高危参数高频用户组单独 20 分钟。
   预警：距超时还剩 2 分钟显示柔和提示；继续发送消息即延续会话时长。
   清空范围：AI 对话上下文记忆 + 全部高危链路计数器 + 长对话摘要；
   会话存档 / 可见聊天记录 / 审计日志一律保留，只是 AI 不再记住本次对话内容。 */
const CTX_WARN_BEFORE_MIN = 2;      // 距离超时还剩 2 分钟（固定规则，不开放配置）
const CTX_SUMMARY_TRIGGER = 20;     // 长对话阈值（条）：超过即做确定性摘要压缩

function effectiveCtxMin(){
  const p = store.ctxPolicy;
  if(store.user && p.highRiskGroups.indexOf(store.user.role)>=0) return p.highRiskGroupMin;
  return p.timeoutMin;
}
function resetCtxCounters(){
  const c = store.ctxRuntime.counters;
  c.highRisk=0; c.guard=0; c.composite=0;   // 全部高危链路计数器清零，重新开始识别新问题
}
function clearCtxTimers(){ if(ctxTimer)clearTimeout(ctxTimer); if(ctxWarnTimer)clearTimeout(ctxWarnTimer); ctxTimer=null; ctxWarnTimer=null; }
function resetCtxState(reason){
  store.context.process=''; store.context.product=''; store.context.defect='';
  store.lastRisk='低';
  resetCtxCounters();
  resetFollowChain();          // 延续既有规则：清空时全部高危链路计数器清零，重新开始识别新问题
  const rt=store.ctxRuntime;
  rt.lastMsgTs=0; rt.summary=''; rt.compressedCount=0; rt.warnVisible=false; rt.timedOut=(reason==='timeout');
  clearCtxTimers();
}
function clearContext(silent, reason){

}

function createWorkOrder(payload){
  const night = store.simNight || isNightNow();
  const id = nextWO();
  const order = {
    id, source: payload.source||'人工求助', reporter: payload.reporter||store.user.name,
    reporterRole: payload.reporterRole||ROLES[store.user.role].short, session: payload.session||'',
    summary: payload.summary||'', status:'pending_engineer', handler:'', priority: payload.priority||'中',
    risk: payload.risk||'中', tags: [], created: now(), deadline:'', deadlineTs:null, comments:[], closed:'', timeline:[]
  };
  // AI 识别复合异常自动生成的紧急工单：打【复合疑难】，不走紧急停线穿透分支
  if(payload.source==='系统复合异常') order.tags.push('复合疑难');
  if(payload.urgent){
    order.tags.push('紧急停线/重大良率事故');
    order.priority='紧急'; order.risk='高';
    order.deadline = deadlineIn(30); order.deadlineTs = Date.now()+30*60000;
    order.timeline.push({ t:now(), e: night
      ? '夜间紧急穿透：不暂停计时，即时推送工程师群 + 主管群，30 分钟超时正常执行'
      : '紧急工单穿透：无视日夜，即时推送工程师群 + 主管群，30 分钟超时正常执行' });
    wecomPush(['工程师群','主管群'], '【紧急工单】'+id, '紧急停线/重大良率事故：'+order.summary+'（已即时推送，夜间不暂停计时，30min 未处理将升级）', id);
  } else if(night){
    order.tags.push('夜间上报');
    order.deadline='—（夜间暂停）'; order.deadlineTs=null;
    order.timeline.push({ t:now(), e:'夜间提报，打【夜间上报】，暂停超时倒计时，不自动升级、不夜间打扰' });
  } else {
    order.deadline = deadlineIn(30); order.deadlineTs = Date.now()+30*60000;
    order.timeline.push({ t:now(), e:'日间提报，进入待工程师承接，30 分钟未接单将自动升级' });
    wecomPush(['工程师群'], '新工单 '+id, order.summary+'（请 30 分钟内接单）', id);
  }
  store.orders.unshift(order);
  return order;
}
function deadlineIn(min){ const d=new Date(Date.now()+min*60000); return d.toLocaleString('zh-CN',{hour12:false}); }

/* 我的工单 / 顶部红点 共用：归属判定 + 超时倒计时（沿用定稿日夜逻辑） */
function isMyOrder(o, user){
  if(!user) return false;
  if(user.role==='team_lead')  return o.reporterRole==='班组长';                                   // 班组长：自己提交的
  if(user.role==='engineer')   return o.reporter===user.name || o.handler===user.name || o.status==='pending_engineer'; // 自己提交 + 派给自己承接
  if(user.role==='supervisor') return o.handler===user.name;                                       // 自己接管/转办的
  return false;
}
/* 我的工单：严格个人归属（自己提交 / 已认领承接），不含公共待分配工单 */
function isMine(o, user){
  if(!user) return false;
  if(user.role==='team_lead') return o.reporterRole==='班组长';   // 班组长沿用原角色口径：本班组提报的工单
  return o.reporter===user.name || o.handler===user.name;
}
function parseDeadline(s){
  if(!s || String(s).indexOf('—')>=0) return null;          // 夜间暂停
  const t = String(s).replace(/-/g,'/').replace(/年|月/g,'/').replace('日',' ');
  const d = new Date(t);
  return isNaN(d.getTime()) ? null : d.getTime();
}
function orderCountdown(o, nowTs){
  if(o.status==='closed') return { text:'已闭环', cls:'' };
  const ts = (o.deadlineTs!=null) ? o.deadlineTs : parseDeadline(o.deadline);
  if(ts==null) return { text:'夜间暂停', cls:'' };
  const diff = ts - nowTs;
  if(diff<=0) return { text:'已超时', cls:'timeout' };
  const m = Math.floor(diff/60000), s = Math.floor((diff%60000)/1000);
  return { text:(m>0? m+'分':'')+s+'秒', cls: diff < 10*60000 ? 'urgent' : '' };
}

/* 工单口径判定（两类分开，避免相互误伤）：
   - isUrgentOrder：紧急工单（标签含「紧急」或 priority=紧急）→ 夜间计时穿透，不暂停
   - isUrgentStop ：标记「紧急停线」的工单 → 处理角色改为「待主管同步盯控」
   复合疑难属前者但不属后者：不触发穿透告警、也不改盯控角色。 */
function isUrgentOrder(o){ return (o.tags && o.tags.some(t=>t.indexOf('紧急')>=0)) || o.priority==='紧急'; }
function isUrgentStop(o){ return !!(o.tags && o.tags.some(t=>t.indexOf('紧急停线')>=0)); }
// 紧急停线工单由主管同步盯控；详情可带出实际承接人，避免覆盖后信息丢失
function handlerRole(o, verbose){
  if(!isUrgentStop(o)) return o.handler || '待分配';
  return '待主管同步盯控' + (verbose && o.handler ? '（实际承接：'+o.handler+'）' : '');
}
// 超时展示规则：状态标签 + 计时辅助文本（沿用定稿日夜逻辑）
function fmtTs(ts){ if(ts==null) return '—'; return new Date(ts).toLocaleString('zh-CN',{hour12:false}); }
function timeoutDisplay(o, nowTs){
  const isUrgent = isUrgentOrder(o);
  const isNight  = o.tags.indexOf('夜间上报')>=0;
  if(o.status==='closed') return { tagType:'success', tagText:'已闭环', aux:'', blink:false };
  // 复合疑难：AI 识别的紧急工单，不触发穿透升级告警（不显示升级倒计时、不闪烁）
  if(o.tags.indexOf('复合疑难')>=0) return { tagType:'warning', tagText:'复合疑难｜主管介入', aux:'AI 识别 · 不触发穿透升级告警', blink:false };
  // 紧急工单穿透夜间策略：不暂停计时，继续走 30 分钟倒计时
  if(isNight && !isUrgent) return { tagType:'info', tagText:'夜间上报｜暂停计时', aux:'次日 08:10 恢复计时', blink:false };
  const ts = (o.deadlineTs!=null) ? o.deadlineTs : parseDeadline(o.deadline);
  // 紧急工单即使未初始化截止时间，也不得显示「暂停计时」
  if(ts==null) return isUrgent ? { tagType:'danger', tagText:'⚠️ 紧急停线｜计时待初始化', aux:'', blink:false }
                              : { tagType:'info', tagText:'暂停计时', aux:'', blink:false };
  const diff = ts - nowTs;
  if(diff<=0) return { tagType:'danger', tagText:'已超时，已升级主管', aux:'', blink:false };
  const m=Math.floor(diff/60000), s=Math.floor((diff%60000)/1000);
  const timeStr = '剩余 '+(m>0?m+'分':'')+s+'秒升级';
  if(isUrgent) return { tagType:'danger', tagText: isNight ? '⚠️ 紧急停线｜夜间不暂停' : '⚠️ 紧急停线', aux:timeStr, blink: diff<10*60000 };
  if(diff < 10*60000) return { tagType:'danger', tagText:'即将超时！', aux:timeStr, blink:true };
  return { tagType:'warning', tagText:'处理中计时', aux:timeStr, blink:false };
}

  if(!store.user) return;
  if(t60) clearTimeout(t60);
  t60 = setTimeout(()=>{ logout('60 分钟无操作：已强制登出'); }, 60*60*1000);
}
function stopTimers(){ if(t60)clearTimeout(t60); if(idleReset)clearInterval(idleReset); clearCtxTimers(); }
function bindIdle(){
  ['click','keydown','mousemove','scroll','touchstart'].forEach(ev=>{
    window.addEventListener(ev, resetIdle, { passive:true });
  });
}
// 上下文计时：只在「有新消息」时重置，鼠标移动 / 点击等闲置操作不延续会话时长
function armCtxTimer(){
  clearCtxTimers();
  if(!store.user || !store.messages.length || !store.ctxRuntime.lastMsgTs) return;
  const min = effectiveCtxMin();
  store.ctxRuntime.warnVisible = false;
  ctxWarnTimer = setTimeout(()=>{ if(store.messages.length) store.ctxRuntime.warnVisible = true; },
    Math.max(0, (min - CTX_WARN_BEFORE_MIN)*60*1000));
  ctxTimer = setTimeout(()=>{ clearContext(false, 'timeout'); }, min*60*1000);
}
function bumpCtxActivity(){
  store.ctxRuntime.lastMsgTs = Date.now();
  store.ctxRuntime.timedOut = false;
  armCtxTimer();
}
// 长对话摘要压缩：确定性文本收敛，不调用模型；不删除任何可见消息与存档记录
function maybeCompress(){
  const msgs = store.messages;
  if(msgs.length <= CTX_SUMMARY_TRIGGER) return;
  const early = msgs.slice(0, msgs.length - CTX_SUMMARY_TRIGGER);
  const picks = early.filter(m=>m.r==='user' && m.t).slice(-CTX_SUMMARY_KEEP).map(m=>String(m.t).slice(0,24));
  store.ctxRuntime.summary = picks.join('；');
  store.ctxRuntime.compressedCount = early.length;
}
// 高危链路计数：仅统计命中，不参与任何风控判定
function countHighRisk(m){
  if(!m || m.r!=='bot') return;
  const c = store.ctxRuntime.counters;
  if(m.risk==='高') c.highRisk++;
  if(m.guard) c.guard++;
  if(/复合|耦合/.test(m.t||'')) c.composite++;
}
function onNewMessage(m){
  countHighRisk(m);
  maybeCompress();
  bumpCtxActivity();
}

/* ========================= 分级追问风控（严格按业务规则）=========================
   1) 仅 HIGH_RISK_TOPICS 五类高危调参场景启用单链路最多 3 轮连续追问；低风险咨询不计数、不限制。
   2) 语义链路由 classifyRisk() 自动判定的 topic + chain 驱动：相同链路标识 = 延续同一诉求（累加轮次），
      不同链路标识 = 新的高危问题（开启全新独立链路，从第 1 轮重新计数）。
   3) 中途切入低风险话题 → 当前高危链路终止、计数器冻结清零。
   4) 第 2 轮结束 → 柔和前置提醒；第 3 轮上限 → 不再推演参数方案，给转人工 / 新开对话按钮。
   注：sessionRisk 是「会话级」标记，仅新开对话 / 切换案例 / 登出时重置；链路终止不影响会话标记。 */
function isHighRiskTopic(t){ return HIGH_RISK_TOPICS.indexOf(t) >= 0; }

// 链路终止：计数器冻结清零（轮次不保留、限制不延续）
function resetFollowChain(){
  const f = store.followRisk;
  f.activeTopic=''; f.activeChain=''; f.rounds=0;
  f.warnVisible=false; f.capped=false;
}
// 开启全新独立计数链路
function startFollowChain(topic, key){
  const f = store.followRisk;
  f.activeTopic=topic; f.activeChain=key; f.rounds=1;
  f.warnVisible=false; f.capped=false;
  f.sessionRisk=true;
}
/* 每条「用户追问」按语义判定结果驱动状态机；返回 'low' | 'count' | 'warn' | 'capped' | 'capped_again' */
function applyFollowRisk(topic, chain){
  const f = store.followRisk;
  if(!isHighRiskTopic(topic)){      // 低风险咨询：终止当前高危链路、计数器冻结清零
    resetFollowChain();
    return 'low';
  }
  const key = topic + '|' + (chain || topic);
  if(f.capped && f.activeChain===key) return 'capped_again';   // 同链路已达上限：不推演、不再累加
  if(f.activeChain!==key){          // 新的高危诉求 → 全新独立链路，从第 1 轮重新计数
    startFollowChain(topic, key);
  }else{
    f.rounds++;                     // 延续同一诉求 → 累加轮次
  }
  if(f.rounds >= FOLLOW_LIMIT){
    f.rounds=FOLLOW_LIMIT; f.warnVisible=false; f.capped=true; return 'capped';
  }
  if(f.rounds === FOLLOW_WARN_AT){
    f.warnVisible=true; f.capped=false; return 'warn';
  }
  f.warnVisible=false; f.capped=false; return 'count';
}

/* 命中片段：仅保存检索命中的截断片段，不在对话中展示文档完整原文 */
const DOC_SNIPPETS = {
  'D-SOP-01':'涂布转速与膜厚窗口须在首件确认后锁定；膜厚 3σ 超规时回溯涂布头气压与…',

  'D-EXP-01':'Mura 按三级分等处置：先确认曝光能量与膜厚，再执行临时工艺补偿；等级升级须…',
  'D-EXP-02':'点缺陷按面积与亮度判级，可修复项进入返修流程，批量复发需追溯洁净度与…',
  'D-WIN-01':'曝光能量标准窗口 22–28 mJ，硬上限 28 mJ；超限须提交 ECN 评审放行，禁止现场…',
  'D-WIN-02':'CF 烤箱峰值温度上限 235℃；超温触发停线复核，需回溯温度曲线与 RGB 膜厚…',
  'D-CASE-01':'抽检膜厚 3σ 超规，回扫曝光能量日志后锁定涂布头老化；更换涂布头并重置窗口…',
  'D-CASE-02':'亮点批量复发追溯至 PI 涂布环境颗粒管控失效，更换 FFU 滤网并提升洁净度后…',
  'D-CASE-03':'烤箱温度与 RGB 膜厚耦合漂移，经多因子 DOE 锁定温漂；PID 重整定后收紧窗口…'
};
/* 相关性关键词：只有「回答文本」与「文档元数据」同时命中才计分，避免硬凑来源 */
const SOURCE_KW = [
  { k:'曝光能量', w:8 }, { k:'烤箱温度', w:8 }, { k:'Mura', w:6 }, { k:'亮点', w:6 },
  { k:'色偏', w:6 }, { k:'膜厚', w:5 }, { k:'涂布', w:5 }, { k:'滤网', w:5 },
  { k:'ECN', w:5 }, { k:'复合', w:5 }, { k:'处置卡', w:4 }, { k:'案例库', w:4 }
];
/* 门控：纯追问补全类回答不产生溯源；明确「检索未命中」的回答展示提示文案 */
function hasSourceBlock(m){
  if(!m || m.r!=='bot') return false;
  const t = String(m.t||'');
  if(/请补充|请确认|为精准定位|请提供/.test(t) && !/建议查阅|检测到|D-[A-Z]+-\d+|上限|ECN|护栏/.test(t)) return false;
  if(m.doc) return true;                 // 含 '—'：已检索但无命中 → 显示「无匹配参考文档」
  return /建议查阅|检索|检测到|识别为|按规则|已记录|上限|处置卡|案例库|护栏|D-[A-Z]+-\d+|标准窗口|ECN|已基于上下文/.test(t);
}
/* 按相关性派生来源：直接引用 > 关键词命中 > 制程/产品命中；过滤失效文档与越权文档 */
function sourcesFor(m){
  if(!hasSourceBlock(m) || m.doc==='—') return [];
  const t = String(m.t||'') + ' ' + String(m.doc||'');
  const lv = roleAb().docRiskLevels;                  // 权限隔离：班组长不含高风险文档
  const ids = [...new Set(t.match(/D-[A-Z]+-\d+/g) || [])];
  return DOCUMENTS
    .filter(d=> d.status!=='失效' && lv.includes(d.risk))   // 失效 / 越权文档不算可信来源
    .map(d=>{
      const metaText = [d.title, d.summary, d.rootCause||'', d.highParam||'', d.defect||''].join(' ');
      let score = 0;
      if(ids.includes(d.id)) score += 40;                    // 回答中直接引用的文档，相关性最高
      for(const kw of SOURCE_KW){ if(t.indexOf(kw.k)>=0 && metaText.indexOf(kw.k)>=0) score += kw.w; }
      if(d.process && t.indexOf(d.process)>=0) score += 5;
      if(d.product && t.indexOf(d.product)>=0) score += 5;
      if(score<=0) return null;
      const ver = d.ver || '';
      const meta = (ver && d.title.indexOf(ver)<0 ? ver+' · ' : '') + '生效 '+d.effective;
      return { docId:d.id, title:d.title, meta, snippet:DOC_SNIPPETS[d.id]||d.summary, score, risk:d.risk };
    })
    .filter(Boolean)
    .sort((a,b)=> b.score-a.score || a.docId.localeCompare(b.docId));
}
/* 文档名点击：跳到工艺文档库并自动打开该原始文档详情（复用既有弹窗与权限口径） */
function openSourceDoc(docId){
  const d = DOCUMENTS.find(x=>x.id===docId);
  if(!d){ EP.ElMessage.warning('未找到对应原始文档'); return; }
  if(!roleAb().docRiskLevels.includes(d.risk)){ EP.ElMessage.warning('当前角色无权查看该风险等级文档'); return; }
  if(store.currentPage!=='docs') store.history.push(store.currentPage);
  store.pendingDocId = docId;
  store.currentPage = 'docs';
}
/* 每条 AI 回答独立持有展开状态：切换案例 / 清空对话不会串状态 */
const SourceRefs = {
  props:{ msg:{ type:Object, default:null } },
  setup(props){
    const MAX = 3;
    const expanded = ref(false);
    const show = computed(()=> hasSourceBlock(props.msg));
    const list = computed(()=> show.value ? sourcesFor(props.msg) : []);
    const visible = computed(()=> expanded.value ? list.value : list.value.slice(0, MAX));
    const extra = computed(()=> Math.max(0, list.value.length - MAX));
    const isLead = computed(()=> !!(store.user && store.user.role==='team_lead'));
    function snippet(s){ return isLead.value
      ? s.snippet.replace(/(\d+(\.\d+)?\s*(mJ|℃|μm|ft³))/g,'（高风险参数已隐藏）')
      : s.snippet; }                                   // 片段数值脱敏与正文口径一致
    function toggle(){ expanded.value = !expanded.value; }
    return { show, list, visible, extra, expanded, snippet, toggle, openSourceDoc };
  },
  template:`
  <div v-if="show" class="wb-src">
    <div class="wb-src-head">
      <span>溯源来源{{ list.length ? ' · 共 '+list.length+' 条' : '' }}</span>
      <span v-if="list.length">按相关性排序</span>
    </div>
    <div v-if="!list.length" class="wb-src-empty">无匹配参考文档</div>
    <template v-else>
      <div v-for="(s,i) in visible" :key="s.docId" class="wb-src-item">
        <div>
          <span class="wb-src-meta">{{i+1}}. </span><a class="wb-src-title" href="javascript:void(0)"
            @click="openSourceDoc(s.docId)" :title="'打开原始文档 '+s.docId">{{s.title}}</a><span class="wb-src-meta">（{{s.meta}}）</span>
        </div>
        <div class="wb-src-snippet">【命中片段】{{snippet(s)}}</div>
      </div>
      <button v-if="extra>0" type="button" class="wb-src-more" @click="toggle" :aria-expanded="expanded ? 'true' : 'false'">
        {{ expanded ? '收起来源' : '查看更多来源（另 '+extra+' 条）' }}<i class="wb-src-caret" :class="{up:expanded}"></i>
      </button>
    </template>
  </div>`
};

/* ========================= 点赞踩统一反馈 · 归类 / 记录 / 组件 =========================
   归类是确定性规则（显式术语 + 消息字段），不是模型推理，也不暴露给用户选择。 */
function isRiskNotice(m){
  if(m.guard) return true;
  const t=String(m.t||'');
  return /护栏拦截|高风险参数|风险提示|三轮|3轮|连续推演|禁止输出|停线复核|升级主管|不强行推理|已自动触发人工工单|最多支持/.test(t);
}
function isClarify(m){
  const t=String(m.t||'');
  return /请补充|请确认|为精准定位|请提供|请描述/.test(t)
      && !/建议查阅|检测到|D-[A-Z]+-\d+|上限|ECN|护栏/.test(t);
}
function feedbackKind(m){
  if(!m) return '';
  if(m.fbKind) return m.fbKind;                 // 三轮上限拦截提示条：显式归为风控通知
  if(m.r==='nomatch') return 'zerohit';
  if(m.r!=='bot') return '';                    // system 为系统提示，非 AI 输出气泡
  if(isRiskNotice(m)) return 'risk';
  if(isClarify(m)) return 'clarify';
  return 'formal';                              // 其余 AI 回答归为正式工艺回答（含检索结论）
}
/* 命中 Chunk：取相关性最高的溯源片段，与本条会话 / 风险标签一并写入汇总记录 */
function fbChunk(m){
  if(feedbackKind(m)!=='formal') return '—';
  const list = sourcesFor(m);
  if(!list.length) return '—（未命中 Chunk）';
  const s = list[0];
  return s.docId + '｜' + (DOC_SNIPPETS[s.docId] || s.snippet || '');
}
function fbEnsureId(m){
  if(!m.fbId) m.fbId = 'FB-'+Math.random().toString(36).slice(2,10);
  return m.fbId;
}
/* 一条消息只保留一条汇总记录；重复点击更新同一条，不产生重复反馈 */
function fbRecord(m, vote, question, session){
  const fbId = fbEnsureId(m), kind = feedbackKind(m);
  let rec = store.feedback.find(x=>x.fbId===fbId);
  if(!rec){
    rec = { id:'F-'+Date.now().toString(36).toUpperCase().slice(-5), fbId };
    store.feedback.unshift(rec);
  }
  const prevReason = rec.reason;
  Object.assign(rec, {
    time: now(), session: session || store.currentSessionTitle || '当前会话（进行中）',
    question: question || '—', kind, kindLabel: FB_KIND_LABEL[kind] || '—',
    excerpt: String(m.t||m.q||'').slice(0,42),
    chunk: fbChunk(m), risk: m.risk || '—',
    vote, voteLabel: vote==='up' ? (kind==='formal'?'回答认可':'认可') : '不认可',
    demo:false
  });
  rec.reason = vote==='up' ? '' : (kind==='formal' ? (prevReason && prevReason!=='未填写' ? prevReason : '未填写') : '');
  if(vote==='up') rec.comment='';
  // 定稿标签：按「消息类型 × 反馈方向」确定性打标；formal 点踩的标签由二级面板所选原因补充
  const voteTag = (FB_VOTE_TAG[kind] || {})[vote] || '';
  rec.tags = voteTag ? [voteTag] : [];
  if(kind==='formal' && vote==='down' && rec.reason && rec.reason!=='未填写'
     && rec.tags.indexOf(rec.reason)<0) rec.tags.push(rec.reason);
  return rec;
}
function fbUpdateReason(rec, reason, comment){
  rec.reason = reason || '未填写';
  rec.comment = String(comment||'').trim();
  rec.voteLabel = '不认可';
  rec.tags = rec.tags.filter(t=>t!=='回答认可');
  if(rec.reason!=='未填写' && rec.tags.indexOf(rec.reason)<0) rec.tags.push(rec.reason);
  rec.time = now();
}

/* 每条 AI 输出气泡右下角一组 👍 / 👎；一级点击与二级面板状态各自独立 */
const MsgFeedback = {

      const r = store.feedback.find(x=>x.fbId===props.msg.fbId);
      return r ? r.vote : '';
    });
    const approved = computed(()=> strong.value && voted.value==='up');
    // 弱化图标点击后的「已记录」提示：只做悬浮 / 读屏状态反馈，不弹面板、不改气泡文案
    const recordTag = computed(()=>{
      const r = store.feedback.find(x=>x.fbId===props.msg.fbId);
      return r && r.tags && r.tags.length ? r.tags.join('、') : '';
    });
    function vote(v){
      const r = fbRecord(props.msg, v, props.question, props.session);
      if(v==='down' && strong.value){
        reason.value = r.reason && r.reason!=='未填写' ? r.reason : '';
        comment.value = r.comment || '';
        panel.value = true;                    // 仅第 1 类正式回答点踩才出现二级面板
        revealPanel();
      }else{
        panel.value = false;                  // 其余场景一律静默记录
      }
    }
    function closePanel(){ panel.value=false; }
    function submitPanel(){
      const r = store.feedback.find(x=>x.fbId===props.msg.fbId);
      if(r) fbUpdateReason(r, reason.value, comment.value);
      panel.value=false;
    }
    return { kind, kindLabel, strong, panel, panelEl, reason, comment, voted, approved, recordTag,
             FB_REASONS, vote, closePanel, submitPanel };
  },
  template:`
  <div class="wb-fb" :class="{'is-weak':!strong}" :title="kindLabel">

/* ========================= 无可信检索来源 · 兜底判定 ========================= */
/* 前端模拟检索：提问带明确查询意图、但不含任何工艺实体词 → 判定知识库零命中。
   命中实体词或属模糊陈述时，仍交回既有 generateReply / 递进追问流程，原逻辑不改。 */
const NO_MATCH_ENTITY = /Array|CF|Cell|P55|M32|Mura|亮点|暗斑|色偏|断线|曝光能量|烤箱温度|涂布|膜厚|滤网|ECN|复合|耦合|良率|停线|参数|窗口|D-[A-Z]+-\d+/i;
const NO_MATCH_ASK = /[?？]|怎么|如何|为什么|是否|能不能|能否|多少|多久|标准|规范|流程|要求|原因|查一下|有没有|请问|咨询|是什么|该怎么/;
function isNoMatchQuery(text){
  const t = String(text||'').trim();
  if(!t) return false;
  if(!NO_MATCH_ASK.test(t)) return false;       // 模糊陈述：保留原有递进追问补全
  return !NO_MATCH_ENTITY.test(t);              // 明确提问但零实体命中：走兜底提示
}

    }
    function clearCtx(){ clearContext(true, 'manual'); store.messages.push({ r:'system', t:'上下文已手动清空（制程/产品/不良缓存）。' }); }

    function stopStream(){ if(streamTimer){ clearTimeout(streamTimer); streamTimer=null; } }
    function emitAutoOrder(c){
      const o = createWorkOrder({ source:'系统复合异常', reporter:'RAG系统', reporterRole:'系统', summary:'CF M32 烤箱温度+膜厚+色偏耦合漂移', risk:'高', priority:'紧急' });
      wecomPush(['工程师群','主管群'],'【复合异常工单】'+o.id,'系统识别复合耦合异常，已直推主管介入池，双向并行处理。', o.id);
    }
    // 预制脚本里 AI 确认「已记录/已补全上下文」的气泡携带 setCtx：
    // 流式推送与跳过流式两条路径都同步写回 store.context，保证状态栏与对话文案一致。
    // 案例4（零命中兜底）不带 setCtx，刻意保持无上下文，符合「不推测、不溯源」语义。
    function applyCaseCtx(m){
      const c = m && m.setCtx; if(!c) return;
      if(c.process!==undefined) store.context.process = c.process;
      if(c.product!==undefined) store.context.product = c.product;
      if(c.defect!==undefined)  store.context.defect  = c.defect;
    }
    // 流式推送与跳过流式共用同一条消息出口：上下文回写、链路计数、统计必须一致
    // 注：预制演示脚本若自带 topic/chain，仅作脚本编排数据，不暴露为 UI 控件；
    //     用户手动输入一律走 send() → classifyRisk() 自动判定，无需任何选择。
    function emitScriptMessage(m){
      applyCaseCtx(m);
      store.messages.push(m);
      if(m.r==='user' && m.topic) applyFollowRisk(m.topic, m.chain);
      onNewMessage(m);
      if(m.r==='bot' && m.risk) setRisk(m.risk);
      if(m.r==='system' && streamCase.c.autoOrder && !streamCase.done){ streamCase.done=true; emitAutoOrder(streamCase.c); }
    }
    function pushNext(){
      if(!streamCase) return;
      if(streamCase.idx >= streamCase.c.msgs.length){ streaming.value=false; streamCase=null; streamTimer=null; return; }
      emitScriptMessage({ ...streamCase.c.msgs[streamCase.idx] });
      scroll();
      streamCase.idx++;
      streamTimer = setTimeout(pushNext, streamCase.c.interval || CASE_PLAY_INTERVAL_MS);   // 支持案例级播放间隔覆盖
    }
    function playCase(id){
      stopStream();
      const c = CASE_SCRIPTS[id];
      streamCase = { c, idx:0, done:false };
      store.messages = []; clearContext(true); setRisk('低');
      store.followRisk.sessionRisk = false;   // 切换案例 = 开启新会话
      streaming.value = true;
      pushNext();
      EP.ElMessage({ type:'info', message:'正在流式载入：'+c.name+'（可点「跳过流式输出」一次性加载）' });
    }
    function skipStream(){
      if(!streamCase) return;
      stopStream();
      while(streamCase.idx < streamCase.c.msgs.length){
        emitScriptMessage({ ...streamCase.c.msgs[streamCase.idx] });
        streamCase.idx++;
      }
      streaming.value=false; streamCase=null;
      scroll();
    }

    function archiveSession(){
      if(!store.messages.length){ EP.ElMessage.warning('当前没有可存档的会话'); return; }
      const id = 'S-'+Math.floor(Math.random()*9000+1000);
      const title = store.currentSessionTitle || ('会话 '+id);
      store.sessions.unshift({ id, title, time:now(), risk:store.lastRisk, status:'已存档', orderTag:'',
        messages: store.messages.map(m=>({...m})) });   // 存档时保存逐条聊天记录快照，供【详情】查看
      EP.ElMessage.success('会话已存档：'+id);
    }

    function openHelp(){ help.noMatch=false; helpVisible.value=true; }
    // 分级追问风控上限按钮：沿用既有「提交人工求助工单」弹窗，不新增流程
    function openFollowOrder(){ openHelp(); }
    // 【新开对话】：开启全新会话，链路计数器与【风险会话】标记一并清除
    function startNewChat(){
      stopStream();
      store.messages = [];
      clearContext(true);                     // 连带全部高危链路计数器清零
      store.followRisk.sessionRisk = false;  // 新会话：不再标记为风险会话
      store.currentSessionTitle = '';
      setRisk('低');
      EP.ElMessage({ type:'info', message:'已新开对话' });
      scroll();
    }
    // 兜底气泡「转人工咨询」：带入原始提问，标记提交时打「知识库未命中」标签
    function openHelpFromNoMatch(q){
      help.summary = q || '';
      help.noMatch = true;
      helpVisible.value = true;
    }
    // 兜底气泡「重新提问」：只清空输入框，不改动输入框本身与既有逻辑
    function reAsk(){
      input.value='';
      EP.ElMessage.info('输入框已清空，可补充制程 / 产品 / 不良现象后重新提问');
    }
    function submitHelp(){
      if(!help.summary){ EP.ElMessage.warning('请填写问题摘要'); return; }
      const o = createWorkOrder({ source:'人工求助', summary:help.summary, session:help.session, urgent:help.urgent, risk:help.urgent?'高':'中', priority:help.urgent?'紧急':'中' });
      if(help.noMatch){
        o.tags.push('知识库未命中');
        o.timeline.push({ t:now(), e:'来源：智能问答「无可信检索来源」兜底转人工，已带入原始提问' });
      }
      if(!help.urgent){
        const night = store.simNight||isNight();
        if(night && store.user.role==='team_lead'){
          wecomPush(['本人'],'夜间提交提示','当前为工艺工程师非在岗时段，工单已登记，将在次日上班后统一安排处理；紧急重大良率事故请走现场电话应急通道。');
        }
      }
      helpVisible.value=false; help.summary=''; help.session=''; help.urgent=false; help.noMatch=false;
      EP.ElMessage.success('工单已提交：'+o.id+(o.tags.includes('夜间上报')?'（已打夜间上报）':''));
    }

    function simCtxTimeout(){ clearContext(false, 'timeout'); }
    function simLoginTimeout(){ logout('模拟登录超时：60 分钟无操作已强制登出'); }

    return { input, chat, helpVisible, help, cases, sessionList, hasCtx, riskColor, riskText, isNight, isLead, mask, streaming, send, askClearCtx, clearCtx, playCase, skipStream, archiveSession, openHelp, openFollowOrder, startNewChat, openHelpFromNoMatch, reAsk, submitHelp, simCtxTimeout, simLoginTimeout, capNotice:FB_CAP_MSG, questionAt, lastQuestion, store };
  }
};

  setup(){
    const metrics = computed(()=>{
      const all=[...store.evalGold,...store.evalBlind];
      const hallu = Math.round(all.filter(x=>x.hallu).length/all.length*100);
      return { hallu, block: 92, recall: 95 };
    });
    function riskCls(r){ return r==='高'?'tag-high':r==='中'?'tag-mid':'tag-low'; }
    const tagFilter = ref('');
    const fbStats = computed(()=>{
      const f = store.feedback;
      return { total:f.length, up:f.filter(x=>x.vote==='up').length,
               down:f.filter(x=>x.vote==='down').length,
               zero:f.filter(x=>(x.tags||[]).indexOf(FB_ZERO_TAG)>=0).length };
    });
    // 按标签分类：定稿标签固定优先序，二级面板原因标签与非分类记录随后
    const fbTagGroups = computed(()=>{
      const f = store.feedback, names = FB_TAG_ORDER.slice();
      f.forEach(x=> (x.tags||[]).forEach(t=>{ if(names.indexOf(t)<0) names.push(t); }));
      const groups = names.map(name=>({ name, count:f.filter(x=>(x.tags||[]).indexOf(name)>=0).length }));
      const untagged = f.filter(x=> !(x.tags||[]).length).length;
      if(untagged) groups.push({ name:FB_UNTAGGED, count:untagged });
      return groups;
    });
    const feedbackRows = computed(()=>{
      const t = tagFilter.value, f = store.feedback;
      if(!t) return f;
      if(t===FB_UNTAGGED) return f.filter(x=> !(x.tags||[]).length);
      return f.filter(x=> (x.tags||[]).indexOf(t)>=0);
    });
    // 文档增补线索按标签归类：0 命中 👍 标【确实无对应资料】，不进入线索表
    const zeroFeedback = computed(()=> store.feedback.filter(x=>(x.tags||[]).indexOf(FB_ZERO_TAG)>=0));
    return { store, metrics, riskCls, fbStats, zeroFeedback, zeroTag:FB_ZERO_TAG,
             tagFilter, feedbackRows, fbTagGroups };
  }
};

  template:`
  <div class="wb-card" style="padding:16px;">

      </div>
      <div class="wb-stat wb-stat-link" role="button" tabindex="0" :aria-label="'紧急工单 '+metrics.urgent+' 条，点击进入工单池'" @click="goPool('urgent')" @keyup.enter="goPool('urgent')" @keyup.space.prevent="goPool('urgent')">
        <div class="n" style="color:var(--wb-red)">{{metrics.urgent}}</div><div class="l">紧急工单</div>
      </div>
      <!-- 新增 2 张业务指标卡：与原有卡同列宽，纯统计展示，第二行右侧自然留白 -->
      <div class="wb-stat wb-stat-static">
        <div class="n" style="color:var(--wb-green)">{{metrics.urgentCloseRate}}%</div><div class="l">紧急工单闭环率</div>
      </div>
      <div class="wb-stat wb-stat-static">
        <div class="n" style="color:var(--wb-red)">{{metrics.overduePct}}%</div><div class="l">超时工单占比</div>
      </div>
    </div>

    <div class="wb-chart">
      <div class="wb-chart-head">
        <div style="font-weight:700;font-size:14px;">工单提报/闭环趋势</div>
        <div class="wb-chart-legend">
          <span><i class="wb-chart-lg" style="background:var(--wb-blue)"></i>工单提报</span>

        <div class="wb-mini" style="flex-basis:100%;">按提报日期 / 闭环日期分别汇总 · 最近 {{trend.length}} 个有工单的日期（演示数据）</div>
      </div>
      <div class="wb-chart-bars">
        <div class="wb-chart-col" v-for="t in trend" :key="t.date" :title="t.date+'：提报 '+t.report+' 单 / 闭环 '+t.close+' 单'">
          <div class="wb-chart-pair">
            <div class="wb-chart-slot">
              <div class="wb-chart-val">{{t.report}}</div>
              <div class="wb-chart-bar is-report" :style="{height:barH(t.report)}"></div>
            </div>
            <div class="wb-chart-slot">
              <div class="wb-chart-val">{{t.close}}</div>
              <div class="wb-chart-bar is-close" :style="{height:barH(t.close)}"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="wb-chart-axis">
        <span class="wb-chart-x" v-for="t in trend" :key="t.date">{{t.date}}</span>
      </div>
      <div class="wb-tip" style="margin-top:12px;">统计口径：工单总量 = 全部状态；超时工单 = 未闭环且倒计时归零；紧急工单 = 含紧急标签或优先级为紧急。紧急工单闭环率 = 紧急工单中状态为已闭环的数量 / 紧急工单总量；超时工单占比 = 超时工单数 / 工单总量。趋势按提报日期（created）与闭环日期（closed）分别汇总，同一日期并列展示提报柱与闭环柱，共用一个纵轴比例。看板仅做统计呈现，工单承接请在【工单池】完成。</div>
    </div>
  </div>`,
  setup(){
    function dateKey(v){
      const m=String(v||'').match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
      return m ? m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0') : '';
    }
    const isUrgent = o => (o.tags||[]).some(t=>t.indexOf('紧急')>=0) || o.priority==='紧急';
    const isOverdue = o => o.status!=='closed' && orderCountdown(o,store.nowTs).cls==='timeout';
    const metrics = computed(()=>{
      const list = store.orders, total = list.length;
      const overdue = list.filter(isOverdue).length;
      const urgentList = list.filter(isUrgent);
      const urgentClosed = urgentList.filter(o=>o.status==='closed').length;
      return {
        total,
        pendingEngineer: list.filter(o=>o.status==='pending_engineer').length,
        pendingSupervisor: list.filter(o=>o.status==='pending_supervisor').length,
        overdue,
        urgent: urgentList.length,
        urgentCloseRate: urgentList.length ? Math.round(urgentClosed/urgentList.length*100) : 0,
        overduePct: total ? Math.round(overdue/total*100) : 0
      };
    });
    /* 双柱趋势：提报按 created、闭环按 closed 各自汇总；日期轴取两者并集的最近 7 个日期，
       同一日期并列两根柱，共用 maxN 一个纵轴比例，避免两组柱各自缩放造成误读。 */
    const trend = computed(()=>{
      const rep={}, clo={};
      store.orders.forEach(o=>{
        const k=dateKey(o.created); if(k) rep[k]=(rep[k]||0)+1;
        if(o.status==='closed'){
          const last = (o.timeline||[]).filter(x=>/闭环/.test(x.e||'')).slice(-1)[0];
          const ck = dateKey(o.closed) || dateKey(last && last.t);
          if(ck) clo[ck]=(clo[ck]||0)+1;
        }
      });
      const keys=[...new Set([...Object.keys(rep),...Object.keys(clo)])].sort().slice(-7);
      return keys.map(k=>({date:k.slice(5), report:rep[k]||0, close:clo[k]||0}));
    });
    const maxN = computed(()=> Math.max(1, ...trend.value.map(t=>Math.max(t.report,t.close))));
    function barH(n){ return n ? Math.max(4, Math.round(n/maxN.value*80))+'%' : '0%'; }
    function goPool(tab){
      store.poolTab = tab;
      if(store.currentPage!=='myorders'){ store.history.push(store.currentPage); store.currentPage='myorders'; }
      const names={ all:'全部', '1':'待处理', '2':'待主管介入', overdue:'已超时', urgent:'紧急工单' };
      EP.ElMessage.info('已跳转【工单池】· '+(names[tab]||''));
    }
    return { store, metrics, trend, barH, goPool };
  }
};

  setup(){
    const filter=ref(store.user && store.user.role==='supervisor' ? '2' : '1');  // 主管默认「待主管介入」，工程师默认「待处理」
    const priFilter=ref(''); const tagFilter=ref('');   // Tab 行右侧叠加筛选（默认空=全部）
    const page=ref(1); const pageSize=ref(8);           // 工单池分页：默认每页 8 条，避免长列表一直下滑
    const dv=ref(false); const cur=ref(null);
    const tv=ref(false); const transferTo=ref(''); const commentText=ref('');
    const convOpen=ref(false); const convSession=ref(''); const convMsgs=ref(null);
    const hlId=ref('');
    const isSup = computed(()=> store.user.role==='supervisor');
    const isLead = computed(()=> store.user.role==='team_lead');
    const canAct = computed(()=> !isLead.value);   // 班组长不可接单/闭环/转派
    // 工单池 Tab：标签与【我的工单】逐字一致（7 个）；主管在「待处理」后额外保留「待主管介入」
    // 内部 name 沿用看板指标卡 / 「去查看」的跳转映射，改名不影响跨页联动
    const commonTabs = [
      {name:'all',label:'全部'},
      {name:'1',label:'待处理'},
      {name:'processing',label:'处理中'},
      {name:'3',label:'已闭环'},
      {name:'overdue',label:'已超时'},
      {name:'night',label:'夜间工单'},
      {name:'urgent',label:'紧急工单'}
    ];
    const tabs = computed(()=> isSup.value
      ? [...commonTabs.slice(0,2), {name:'2',label:'待主管介入'}, ...commonTabs.slice(2)]
      : commonTabs.slice());
    // 看板指标卡 / 「去查看」跳转：poolTab 为一次性目标，进入后立即清空；目标 Tab 对当前角色不可见时回落到默认 Tab
    watch(()=>store.poolTab, (v)=>{ if(v){ filter.value = tabs.value.some(t=>t.name===v) ? v : (isSup.value ? '2' : '1'); store.poolTab=''; } }, {immediate:true});
    // 防越权：工程师不可落入「待主管介入」Tab
    watch(filter, (v)=>{ if(!tabs.value.some(t=>t.name===v)) filter.value = isSup.value ? '2' : '1'; });
    // 切换 Tab / 下拉筛选后回到第 1 页
    watch([filter, priFilter, tagFilter], ()=>{ page.value = 1; });
    const filtered = computed(()=>{
      if(!store.user) return [];
      let list;
      switch(filter.value){
        case '1': list=store.orders.filter(o=>o.status==='pending_engineer'); break;
        case '2': list=store.orders.filter(o=>o.status==='pending_supervisor'); break;
        case '3': list=store.orders.filter(o=>o.status==='closed'); break;
        case 'processing': list=store.orders.filter(o=>o.status==='processing'); break;
        case 'night': list=store.orders.filter(o=>o.tags.some(t=>t.indexOf('夜间')>=0)); break;
        case 'overdue': list=store.orders.filter(o=>o.status!=='closed' && orderCountdown(o,store.nowTs).cls==='timeout'); break;
        case 'urgent': list=store.orders.filter(o=>o.tags.some(t=>t.indexOf('紧急')>=0)||o.priority==='紧急'); break;
        default: list=store.orders.slice();
      }
      // Tab 行右侧下拉：在当前 Tab 视图内二次叠加过滤（切换 Tab 时下拉值保留）
      if(priFilter.value) list=list.filter(o=>o.priority===priFilter.value);
      if(tagFilter.value) list=list.filter(o=>o.tags.some(t=>t.indexOf(tagFilter.value)>=0));
      return sorted(list, 'pool', 'created');   // 默认提交时间倒序，点击表头三角切正序
    });
    const paged = computed(()=> filtered.value.slice((page.value-1)*pageSize.value, page.value*pageSize.value));
    const totalPages = computed(()=> Math.max(1, Math.ceil(filtered.value.length/pageSize.value)));
    function onPageChange(v){ page.value = v; }
    function onSizeChange(sz){ pageSize.value = sz; page.value = 1; }
    // 列表变短（承接 / 闭环 / 筛选）时把页码收回有效范围
    watch(totalPages, (p)=>{ if(page.value>p) page.value=p; });
    watch(()=>store.highlightOrder, (v)=>{

    function riskCls(r){ return r==='高'?'tag-high':r==='中'?'tag-mid':'tag-low'; }
    function statusText(s){ return ({pending_engineer:'待工程师承接',pending_supervisor:'待主管介入',processing:'处理中',closed:'已闭环'})[s]||s; }
    function statusType(s){ return s==='closed'?'success':(s==='processing'?'':'warning'); }
    function tagType(t){ if(t.indexOf('紧急')>=0) return 'danger'; if(t.indexOf('夜间')>=0) return 'info'; if(t.indexOf('复合')>=0||t.indexOf('超时')>=0) return 'warning'; return ''; }
    function td(o){ return timeoutDisplay(o, store.nowTs); }
    function planDeadline(o){ if(o.tags.indexOf('夜间上报')>=0 && !isUrgentOrder(o) && o.status!=='closed') return '次日 08:10 恢复计时'; return fmtTs(o.deadlineTs!=null?o.deadlineTs:parseDeadline(o.deadline)); }
    function convFor(id){ return getSessionMessages(id)!=null; }
    function openConv(id){ convSession.value=id; convMsgs.value=getSessionMessages(id); convOpen.value=true; }
    function rowCls({row}){ return row.id===hlId.value ? 'wb-row-hl' : ''; }
    function maskSummary(o){ if(isLead.value){ return (o.summary||'').replace(/(\d+(\.\d+)?\s*(mJ|℃|μm|ft³))/g,'（高风险参数已隐藏）'); } return o.summary; }
    function openDetail(o){ cur.value=o; commentText.value=''; dv.value=true; }
    function accept(o){ o.status='processing'; o.handler=store.user.name; o.deadline=deadlineIn(store.dayNight.dayTimeout); o.deadlineTs=Date.now()+store.dayNight.dayTimeout*60000; o.timeline.push({t:now(),e:store.user.name+' 接单，进入处理中'}); EP.ElMessage.success('已接单 '+o.id); }
    function closeOrder(o){ o.status='closed'; o.closed=now(); o.timeline.push({t:now(),e:store.user.name+' 填写结论并闭环'}); dv.value=false; EP.ElMessage.success('工单已闭环 '+o.id); }
    function escalate(o){ o.status='pending_supervisor'; o.timeline.push({t:now(),e:store.user.name+' 升级至主管介入池'}); wecomPush(['主管群'],'工单升级 '+o.id,o.summary+' 已升级，请主管介入。', o.id); EP.ElMessage.warning('已升级 '+o.id); }
    function transfer(o){ tv.value=true; cur.value=o; }
    function doTransfer(){ if(!transferTo.value){EP.ElMessage.warning('请选择工程师');return;} cur.value.status='processing'; cur.value.handler=transferTo.value; cur.value.tags=cur.value.tags.filter(t=>t!=='升级'); cur.value.deadline=deadlineIn(store.dayNight.dayTimeout); cur.value.deadlineTs=Date.now()+store.dayNight.dayTimeout*60000; cur.value.timeline.push({t:now(),e:'主管转办指派给 '+transferTo.value+'，重置30分钟倒计时'}); tv.value=false; EP.ElMessage.success('已转办给 '+transferTo.value); }
    function canTake(o){ return canAct.value && (o.status==='pending_engineer' || (isSup.value && o.status==='pending_supervisor')); }
    function takeLabel(o){ return o.status==='pending_supervisor' ? '抢单' : '接单'; }
    function take(o){
      const wasSup = o.status==='pending_supervisor';
      o.status='processing'; o.handler=store.user.name;
      o.deadline=deadlineIn(store.dayNight.dayTimeout); o.deadlineTs=Date.now()+store.dayNight.dayTimeout*60000;
      o.timeline.push({t:now(), e:(wasSup?'主管 ':'')+store.user.name+' 承接工单，进入处理中'});
      EP.ElMessage.success('已承接 '+o.id+'，已自动进入【我的工单】');
    }
    function demoTimeout(){
      const o = store.orders.find(x=>x.status==='pending_engineer');
      if(!o){ EP.ElMessage.info('当前无待承接工单可演示超时'); return; }
      const night = store.simNight||isNightNow();
      // 夜间普通工单暂停；紧急工单穿透，仍执行 30 分钟超时升级
      if(night && !isUrgentOrder(o)){ EP.ElMessage.info('夜间：'+o.id+' 暂停超时，不自动升级、不夜间打扰'); }

      const nightOrders = store.orders.filter(o=>o.tags.includes('夜间上报') && !isUrgentOrder(o) && o.status==='pending_engineer');

    const cur = ref(null);
    const resultStats = computed(()=>{
      const list = cur.value ? cur.value.answers : [];
      return SURVEY_HELP_OPTIONS.map(label=>{
        const n = list.filter(a=>a.help===label).length;
        return { label, n, pct: list.length ? Math.round(n/list.length*100) : 0 };
      });
    });
    const resultComments = computed(()=> (cur.value ? cur.value.answers : [])
      .filter(a=> a.comment && a.comment.trim())
      .map(a=>({ who:a.who, time:a.time, text:a.comment, demo:!!a.demo })));
    function openResult(row){ cur.value=row; resultVisible.value=true; }
    function publishNotice(){
      if(!isAdmin.value) return;                     // 纵深防御：非运营账号一律不下发
      const t = form.title.trim();
      if(!t){ EP.ElMessage.warning('请填写通知标题'); return; }
      const id = 'N-'+Date.now();
      store.notices.unshift({
        id, title:t, body:form.body.trim()||'（无正文）', time:now(),
        unread:true, status:'pending', hasSurvey:true, hintShown:false, answers:null, doneTime:''
      });
      store.noticeHistory.unshift({
        id:'H-'+Date.now(), noticeId:id, title:t, time:now(),
        scope:DEMO_RECEIVE_SCOPE, total:DEMO_RECEIVE_TOTAL,
        answers: DEMO_SURVEY_ANSWERS.map(a=>({...a}))
      });
      form.title=''; form.body='';
      EP.ElMessage.success('通知已下发，附带内置问卷');
    }
    return { store, isAdmin, form, doneCount, history, resultVisible, cur, resultStats, resultComments, openResult, publishNotice };
  }
};

    </el-container>

    <!-- 内置问卷：居中模态 + 半透明遮罩 + 中等尺寸 + 非全屏；仅由消息卡片主动唤起 -->
    <el-dialog v-model="surveyVisible" title="智能问答使用体验问卷" width="560px" top="12vh"
      :modal="true" modal-class="wb-survey-overlay" :close-on-click-modal="false"

  setup(){
    const clock = ref(hhmm());
    /* ---- 站内通知 / 内置问卷（低频，页面无常驻入口）---- */
    const noticeOpen = ref(false);
    const surveyVisible = ref(false);

    const helpOptions = SURVEY_HELP_OPTIONS;   // 题目固定：第一题 5 档选项与运营后台结果统计同源
    const unreadCount = computed(()=> store.notices.filter(n=> n.unread).length);
    const menu = computed(()=> MENU.filter(m=> canView(m.key)) );
    const pageTitle = computed(()=>{ const m=MENU.find(x=>x.key===store.currentPage); return m?m.title:''; });
    const roleColor = computed(()=> ROLES[store.user?store.user.role:'team_lead'].color );
    const alertCount = computed(()=>{
      if(!store.user) return 0;
      return store.orders.filter(o=> isMyOrder(o, store.user) && o.status!=='closed' &&
        (orderCountdown(o, store.nowTs).cls==='urgent' || orderCountdown(o, store.nowTs).cls==='timeout' ||
         o.status==='pending_engineer' || o.status==='pending_supervisor')).length;
    });
    function go(k){
      if(!canView(k) || k===store.currentPage) return;
      store.history.push(store.currentPage);   // 记录上一个页面，供「返回」回退
      store.currentPage = k;
    }
    const canBack = computed(()=> store.history.length>0 );
    const crumbs = computed(()=>{
      const list = [{ key:'qa', label:'首页' }];
      if(store.currentPage!=='qa') list.push({ key:store.currentPage, label:pageTitle.value });
      return list;
    });
    function back(){ if(store.history.length){ store.currentPage = store.history.pop(); } }   // 返回：仅路由回退，不撤销已提交数据
    function toggleSide(){ store.sidebarCollapsed = !store.sidebarCollapsed; }  // 顶部汉堡：折叠/展开侧栏
    function relogin(){ logout('已切换角色 / 登出'); }
    function goView(){
      const id=store.wecom.orderId; store.wecom.visible=false; store.highlightOrder=id;
      const o = store.orders.find(x=>x.id===id);
      if(o && isMine(o, store.user)){ go('mine'); return; }
      if(canView('myorders')){ store.poolTab = store.user.role==='supervisor' ? '2' : '1'; go('myorders'); }
      else go('mine');
    }
    function goAlert(){ go(canView('myorders') ? 'myorders' : 'mine'); }
    function toggleNotice(){ noticeOpen.value = !noticeOpen.value; }
    function goAlertFromNotice(){
      noticeOpen.value=false;
      if(store.user.role==='admin'){ EP.ElMessage.info('运营账号无工单处理权限'); return; }
      goAlert();
    }
    /* 问卷只由消息卡片主动唤起；已完成状态不允许再次打开 */
    function openSurvey(n){
      if(n.status==='done') return;
      surveyNotice.value=n;
      survey.help = n.answers ? n.answers.help : '';
      survey.comment = n.answers ? n.answers.comment : '';
      noticeOpen.value=false;
      surveyVisible.value=true;
    }
    function submitSurvey(){
      const n=surveyNotice.value;
      if(!n || n.status==='done'){ surveyVisible.value=false; return; }   // 不可重复提交
      if(!survey.help){ EP.ElMessage.warning('请先选择帮助程度'); return; }  // 校验失败保留输入、不关闭
      n.answers={ help:survey.help, comment:survey.comment.trim() };
      n.status='done'; n.unread=false; n.doneTime=now();
      // 答卷回写到对应下发批次，供【查看结果】聚合与「已完成填写数量」实时更新
      const h = store.noticeHistory.find(x=> x.noticeId===n.id);
      if(h) h.answers.push({ who:store.user.name, help:survey.help, comment:survey.comment.trim(), time:now(), demo:false });
      surveyVisible.value=false;
      EP.ElMessage.success('问卷已提交，感谢反馈');
    }
    function laterSurvey(){ surveyVisible.value=false; }   // 消息保留在列表内，可再次打开
    function onSurveyClosed(){ surveyNotice.value=null; }
    watch(()=>store.currentPage, ()=> resetTableSort());   // 进入任一页面：所有时间列恢复默认倒序
    // 切换角色 / 登出：关闭消息中心与问卷浮层，避免浮层状态泄漏到下一个用户会话
    watch(()=>store.user, (u)=>{ if(!u){ noticeOpen.value=false; surveyVisible.value=false; surveyNotice.value=null; } });
    let timer=null;
    function syncNarrow(){ const n = window.innerWidth<=1024; store.isNarrow=n; if(n) store.sidebarCollapsed=true; }  // 窄屏默认收起侧栏为抽屉
    onMounted(()=>{
      timer=setInterval(()=>{ clock.value=hhmm(); store.nowTs=Date.now(); }, 1000);
      syncNarrow();
      window.addEventListener('resize', syncNarrow);
    });
    onBeforeUnmount(()=>{ if(timer)clearInterval(timer); window.removeEventListener('resize', syncNarrow); stopTimers(); });
    return { store, menu, pageTitle, roleColor, alertCount, clock, go, back, toggleSide, canBack, crumbs, relogin, goView, goAlert,
      noticeOpen, unreadCount, toggleNotice, goAlertFromNotice, openSurvey, surveyVisible, survey, helpOptions, submitSurvey, laterSurvey, onSurveyClosed };
  }
};
