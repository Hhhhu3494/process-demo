/* 表格时间列排序：兼容 '2026-03-18 09:10' 与 '2026/11/5 17:20:18' 两种日期格式 */
function tsVal(s){
  if(!s) return 0;
  const p = String(s).match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})(?:[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
  if(!p) return 0;
  return new Date(+p[1], +p[2]-1, +p[3], +(p[4]||0), +(p[5]||0), +(p[6]||0)).getTime();
}
/* 受控表格时间排序：按表格 key 隔离状态，默认倒序；点击表头三角在 倒序/正序 两态间切换 */
const TABLE_SORT = reactive({
  archive:'desc', audit:'desc', docs:'desc', pool:'desc', mine:'desc'
});
function sortDir(key){ return TABLE_SORT[key] || 'desc'; }                 // 打开页面默认倒序
function toggleTableSort(key){ TABLE_SORT[key] = sortDir(key)==='desc' ? 'asc' : 'desc'; }
function sorted(list, key, prop){
  const dir = sortDir(key)==='asc' ? 1 : -1;
  return (list||[]).slice().sort((a,b)=> dir * (tsVal(a&&a[prop]) - tsVal(b&&b[prop])));
}
function resetTableSort(){ Object.keys(TABLE_SORT).forEach(k=> TABLE_SORT[k]='desc'); }  // 每次进入页面：时间列恢复默认倒序
/* 时间列表头：label + 上下三角图标（原生 B 端风格），点击切换排序方向 */
const TimeSortHeader = {
  props: { label:String, sortKey:String },
  template:`
    <span class="wb-th-sort" @click="toggle" @keyup.enter="toggle" @keyup.space.prevent="toggle"
          tabindex="0" role="button" :aria-label="label+'排序，当前'+dirText+'，点击切换'" :title="'点击切换排序（当前：'+dirText+'）'">
      <span>{{label}}</span>
      <span class="wb-sort-caret" :class="dir"><i class="up"></i><i class="down"></i></span>
    </span>`,
  setup(props){
    const dir = computed(()=> sortDir(props.sortKey));
    const dirText = computed(()=> dir.value==='desc' ? '时间倒序（新→旧）' : '时间正序（旧→新）');
    function toggle(){ toggleTableSort(props.sortKey); }
    return { dir, dirText, toggle };
  }
};

function createWorkOrder(payload){
  const night = store.simNight || isNightNow();
  const id = nextWO();
  const order = {
    id, source: payload.source||'人工求助', reporter: payload.reporter||store.user.name,
    reporterRole: payload.reporterRole||ROLES[store.user.role].short, session: payload.session||'',
    summary: payload.summary||'', status:'pending_engineer', handler:'', priority: payload.priority||'中',
    risk: payload.risk||'中', tags: [], created: now(), deadline:'', deadlineTs:null, comments:[], closed:'', timeline:[]
  };
  // AI 识别复合异常自动生成的紧急工单：打【复合疑难】，不走紧急停线穿透分支
  if(payload.source==='系统复合异常') order.tags.push('复合疑难');
  if(payload.urgent){
    order.tags.push('紧急停线/重大良率事故');
    order.priority='紧急'; order.risk='高';
    order.deadline = deadlineIn(30); order.deadlineTs = Date.now()+30*60000;
    order.timeline.push({ t:now(), e:'紧急工单穿透：无视日夜，即时推送工程师群 + 主管群，30 分钟超时正常执行' });
    wecomPush(['工程师群','主管群'], '【紧急工单】'+id, '紧急停线/重大良率事故：'+order.summary+'（已即时推送，30min 未处理将升级）', id);
  } else if(night){
    order.tags.push('夜间上报');
    order.deadline='—（夜间暂停）'; order.deadlineTs=null;
    order.timeline.push({ t:now(), e:'夜间提报，打【夜间上报】，暂停超时倒计时，不自动升级、不夜间打扰' });
  } else {
    order.deadline = deadlineIn(30); order.deadlineTs = Date.now()+30*60000;
    order.timeline.push({ t:now(), e:'日间提报，进入待工程师承接，30 分钟未接单将自动升级' });
    wecomPush(['工程师群'], '新工单 '+id, order.summary+'（请 30 分钟内接单）', id);
  }
  store.orders.unshift(order);
  return order;
}

/* 我的工单 / 顶部红点 共用：归属判定 + 超时倒计时（沿用定稿日夜逻辑） */
function isMyOrder(o, user){
  if(!user) return false;
  if(user.role==='team_lead')  return o.reporterRole==='班组长';                                   // 班组长：自己提交的
  if(user.role==='engineer')   return o.reporter===user.name || o.handler===user.name || o.status==='pending_engineer'; // 自己提交 + 派给自己承接
  if(user.role==='supervisor') return o.handler===user.name;                                       // 自己接管/转办的
  return false;
}

function isMine(o, user){
  if(!user) return false;
  if(user.role==='team_lead') return o.reporterRole==='班组长';   // 班组长沿用原角色口径：本班组提报的工单
  return o.reporter===user.name || o.handler===user.name;
}
function parseDeadline(s){
  if(!s || String(s).indexOf('—')>=0) return null;          // 夜间暂停
  const t = String(s).replace(/-/g,'/').replace(/年|月/g,'/').replace('日',' ');
  const d = new Date(t);
  return isNaN(d.getTime()) ? null : d.getTime();
}
function orderCountdown(o, nowTs){
  if(o.status==='closed') return { text:'已闭环', cls:'' };
  const ts = (o.deadlineTs!=null) ? o.deadlineTs : parseDeadline(o.deadline);
  if(ts==null) return { text:'夜间暂停', cls:'' };
  const diff = ts - nowTs;
  if(diff<=0) return { text:'已超时', cls:'timeout' };
  const m = Math.floor(diff/60000), s = Math.floor((diff%60000)/1000);
  return { text:(m>0? m+'分':'')+s+'秒', cls: diff < 10*60000 ? 'urgent' : '' };
}

// 超时展示规则：状态标签 + 计时辅助文本（沿用定稿日夜逻辑）
function fmtTs(ts){ if(ts==null) return '—'; return new Date(ts).toLocaleString('zh-CN',{hour12:false}); }
function timeoutDisplay(o, nowTs){
  const isUrgent = o.tags.some(t=>t.indexOf('紧急')>=0) || o.priority==='紧急';
  const isNight  = o.tags.indexOf('夜间上报')>=0;
  if(o.status==='closed') return { tagType:'success', tagText:'已闭环', aux:'', blink:false };
  // 复合疑难：AI 识别的紧急工单，不触发穿透升级告警（不显示升级倒计时、不闪烁）
  if(o.tags.indexOf('复合疑难')>=0) return { tagType:'warning', tagText:'复合疑难｜主管介入', aux:'AI 识别 · 不触发穿透升级告警', blink:false };
  if(isNight) return { tagType:'info', tagText:'夜间上报｜暂停计时', aux:'次日 08:10 恢复计时', blink:false };
  const ts = (o.deadlineTs!=null) ? o.deadlineTs : parseDeadline(o.deadline);
  if(ts==null) return { tagType:'info', tagText:'暂停计时', aux:'', blink:false };
  const diff = ts - nowTs;
  if(diff<=0) return { tagType:'danger', tagText:'已超时，已升级主管', aux:'', blink:false };
  const m=Math.floor(diff/60000), s=Math.floor((diff%60000)/1000);
  const timeStr = '剩余 '+(m>0?m+'分':'')+s+'秒升级';
  if(isUrgent) return { tagType:'danger', tagText:'⚠️ 紧急停线', aux:timeStr, blink: diff<10*60000 };
  if(diff < 10*60000) return { tagType:'danger', tagText:'即将超时！', aux:timeStr, blink:true };
  return { tagType:'warning', tagText:'处理中计时', aux:timeStr, blink:false };
}

let t20=null, t60=null, idleReset=null;
function resetIdle(){
  if(!store.user) return;

  if(t60) clearTimeout(t60);
  t20 = setTimeout(()=>{ clearContext(false); }, 20*60*1000);   // 20min 清空上下文
  t60 = setTimeout(()=>{ logout('60 分钟无操作：已强制登出'); }, 60*60*1000); // 60min 强制登出
}
function stopTimers(){ if(t20)clearTimeout(t20); if(t60)clearTimeout(t60); if(idleReset)clearInterval(idleReset); }
function bindIdle(){
  ['click','keydown','mousemove','scroll','touchstart'].forEach(ev=>{
    window.addEventListener(ev, resetIdle, { passive:true });
  });
}

/* ========================= AI 回答 · 溯源来源区块 ========================= */
/* 命中片段：仅保存检索命中的截断片段，不在对话中展示文档完整原文 */
const DOC_SNIPPETS = {
  'D-SOP-01':'涂布转速与膜厚窗口须在首件确认后锁定；膜厚 3σ 超规时回溯涂布头气压与…',

  'D-EXP-01':'Mura 按三级分等处置：先确认曝光能量与膜厚，再执行临时工艺补偿；等级升级须…',
  'D-EXP-02':'点缺陷按面积与亮度判级，可修复项进入返修流程，批量复发需追溯洁净度与…',
  'D-WIN-01':'曝光能量标准窗口 22–28 mJ，硬上限 28 mJ；超限须提交 ECN 评审放行，禁止现场…',
  'D-WIN-02':'CF 烤箱峰值温度上限 235℃；超温触发停线复核，需回溯温度曲线与 RGB 膜厚…',
  'D-CASE-01':'抽检膜厚 3σ 超规，回扫曝光能量日志后锁定涂布头老化；更换涂布头并重置窗口…',
  'D-CASE-02':'亮点批量复发追溯至 PI 涂布环境颗粒管控失效，更换 FFU 滤网并提升洁净度后…',
  'D-CASE-03':'烤箱温度与 RGB 膜厚耦合漂移，经多因子 DOE 锁定温漂；PID 重整定后收紧窗口…'
};
/* 相关性关键词：只有「回答文本」与「文档元数据」同时命中才计分，避免硬凑来源 */
const SOURCE_KW = [
  { k:'曝光能量', w:8 }, { k:'烤箱温度', w:8 }, { k:'Mura', w:6 }, { k:'亮点', w:6 },
  { k:'色偏', w:6 }, { k:'膜厚', w:5 }, { k:'涂布', w:5 }, { k:'滤网', w:5 },
  { k:'ECN', w:5 }, { k:'复合', w:5 }, { k:'处置卡', w:4 }, { k:'案例库', w:4 }
];
/* 门控：纯追问补全类回答不产生溯源；明确「检索未命中」的回答展示提示文案 */
function hasSourceBlock(m){
  if(!m || m.r!=='bot') return false;
  const t = String(m.t||'');
  if(/请补充|请确认|为精准定位|请提供/.test(t) && !/建议查阅|检测到|D-[A-Z]+-\d+|上限|ECN|护栏/.test(t)) return false;
  if(m.doc) return true;                 // 含 '—'：已检索但无命中 → 显示「无匹配参考文档」
  return /建议查阅|检索|检测到|识别为|按规则|已记录|上限|处置卡|案例库|护栏|D-[A-Z]+-\d+|标准窗口|ECN|已基于上下文/.test(t);
}
/* 按相关性派生来源：直接引用 > 关键词命中 > 制程/产品命中；过滤失效文档与越权文档 */
function sourcesFor(m){
  if(!hasSourceBlock(m) || m.doc==='—') return [];
  const t = String(m.t||'') + ' ' + String(m.doc||'');
  const lv = roleAb().docRiskLevels;                  // 权限隔离：班组长不含高风险文档
  const ids = [...new Set(t.match(/D-[A-Z]+-\d+/g) || [])];
  return DOCUMENTS
    .filter(d=> d.status!=='失效' && lv.includes(d.risk))   // 失效 / 越权文档不算可信来源
    .map(d=>{
      const metaText = [d.title, d.summary, d.rootCause||'', d.highParam||'', d.defect||''].join(' ');
      let score = 0;
      if(ids.includes(d.id)) score += 40;                    // 回答中直接引用的文档，相关性最高
      for(const kw of SOURCE_KW){ if(t.indexOf(kw.k)>=0 && metaText.indexOf(kw.k)>=0) score += kw.w; }
      if(d.process && t.indexOf(d.process)>=0) score += 5;
      if(d.product && t.indexOf(d.product)>=0) score += 5;
      if(score<=0) return null;
      const ver = d.ver || '';
      const meta = (ver && d.title.indexOf(ver)<0 ? ver+' · ' : '') + '生效 '+d.effective;
      return { docId:d.id, title:d.title, meta, snippet:DOC_SNIPPETS[d.id]||d.summary, score, risk:d.risk };
    })
    .filter(Boolean)
    .sort((a,b)=> b.score-a.score || a.docId.localeCompare(b.docId));
}
/* 文档名点击：跳到工艺文档库并自动打开该原始文档详情（复用既有弹窗与权限口径） */
function openSourceDoc(docId){
  const d = DOCUMENTS.find(x=>x.id===docId);
  if(!d){ EP.ElMessage.warning('未找到对应原始文档'); return; }
  if(!roleAb().docRiskLevels.includes(d.risk)){ EP.ElMessage.warning('当前角色无权查看该风险等级文档'); return; }
  if(store.currentPage!=='docs') store.history.push(store.currentPage);
  store.pendingDocId = docId;
  store.currentPage = 'docs';
}
/* 每条 AI 回答独立持有展开状态：切换案例 / 清空对话不会串状态 */
const SourceRefs = {
  props:{ msg:{ type:Object, default:null } },
  setup(props){
    const MAX = 3;
    const expanded = ref(false);
    const show = computed(()=> hasSourceBlock(props.msg));
    const list = computed(()=> show.value ? sourcesFor(props.msg) : []);
    const visible = computed(()=> expanded.value ? list.value : list.value.slice(0, MAX));
    const extra = computed(()=> Math.max(0, list.value.length - MAX));
    const isLead = computed(()=> !!(store.user && store.user.role==='team_lead'));
    function snippet(s){ return isLead.value
      ? s.snippet.replace(/(\d+(\.\d+)?\s*(mJ|℃|μm|ft³))/g,'（高风险参数已隐藏）')
      : s.snippet; }                                   // 片段数值脱敏与正文口径一致
    function toggle(){ expanded.value = !expanded.value; }
    return { show, list, visible, extra, expanded, snippet, toggle, openSourceDoc };
  },
  template:`
  <div v-if="show" class="wb-src">
    <div class="wb-src-head">
      <span>溯源来源{{ list.length ? ' · 共 '+list.length+' 条' : '' }}</span>
      <span v-if="list.length">按相关性排序</span>
    </div>
    <div v-if="!list.length" class="wb-src-empty">无匹配参考文档</div>
    <template v-else>
      <div v-for="(s,i) in visible" :key="s.docId" class="wb-src-item">
        <div>
          <span class="wb-src-meta">{{i+1}}. </span><a class="wb-src-title" href="javascript:void(0)"
            @click="openSourceDoc(s.docId)" :title="'打开原始文档 '+s.docId">{{s.title}}</a><span class="wb-src-meta">（{{s.meta}}）</span>
        </div>
        <div class="wb-src-snippet">【命中片段】{{snippet(s)}}</div>
      </div>
      <button v-if="extra>0" type="button" class="wb-src-more" @click="toggle" :aria-expanded="expanded ? 'true' : 'false'">
        {{ expanded ? '收起来源' : '查看更多来源（另 '+extra+' 条）' }}<i class="wb-src-caret" :class="{up:expanded}"></i>
      </button>
    </template>
  </div>`
};

/* ========================= 无可信检索来源 · 兜底判定 ========================= */
/* 前端模拟检索：提问带明确查询意图、但不含任何工艺实体词 → 判定知识库零命中。
   命中实体词或属模糊陈述时，仍交回既有 generateReply / 递进追问流程，原逻辑不改。 */
const NO_MATCH_ENTITY = /Array|CF|Cell|P55|M32|Mura|亮点|暗斑|色偏|断线|曝光能量|烤箱温度|涂布|膜厚|滤网|ECN|复合|耦合|良率|停线|参数|窗口|D-[A-Z]+-\d+/i;
const NO_MATCH_ASK = /[?？]|怎么|如何|为什么|是否|能不能|能否|多少|多久|标准|规范|流程|要求|原因|查一下|有没有|请问|咨询|是什么|该怎么/;
function isNoMatchQuery(text){
  const t = String(text||'').trim();
  if(!t) return false;
  if(!NO_MATCH_ASK.test(t)) return false;       // 模糊陈述：保留原有递进追问补全
  return !NO_MATCH_ENTITY.test(t);              // 明确提问但零实体命中：走兜底提示
}

      <!-- 侧边演示案例库 -->
      <div class="wb-card wb-case-card">

    <!-- 人工求助工单弹窗 -->

        <div v-if="help.noMatch" class="wb-nm-tag" style="margin:-4px 0 10px 92px;">已带入当前提问 · 提交后自动打上标签「知识库未命中」</div>

        <el-form-item label="紧急程度">
          <el-checkbox v-model="help.urgent">紧急停线 / 重大良率事故（穿透机制）</el-checkbox>

  setup(){
    const input = ref('');
    const chat = ref(null);
    const helpVisible = ref(false);
    const help = reactive({ summary:'', session:'', urgent:false, noMatch:false });
    const streaming = ref(false);
    let streamTimer = null;
    let streamCase = null;
    const cases = [
      { id:1, name:CASE_SCRIPTS[1].name, desc:'模糊提问，单条递进追问补全上下文' },
      { id:2, name:CASE_SCRIPTS[2].name, desc:'普通不良多轮 → 风险升级 / 参数标红 / 护栏校验' },
      { id:3, name:CASE_SCRIPTS[3].name, desc:'多轮累积 → 复合异常 → 自动工单 + 企微推送' },
      { id:4, name:CASE_SCRIPTS[4].name, desc:'知识库零命中 → 不推测 / 不溯源；浅黄气泡内可「转人工咨询」（带入提问 + 未命中标签）或「重新提问」' }
    ];
    const hasCtx = computed(()=> store.context.process||store.context.product||store.context.defect );
    const riskColor = computed(()=> store.lastRisk==='高'?'var(--wb-red)':store.lastRisk==='中'?'var(--wb-yellow)':'var(--wb-green)' );
    const riskText = computed(()=> store.lastRisk==='高'?'红色 · 高风险':store.lastRisk==='中'?'黄色 · 中风险':'绿色 · 低风险' );

    function isNight(){ return isNightNow(); }
    const isLead = computed(()=> store.user && store.user.role==='team_lead');
    function mask(text){
      // 班组长：隐藏所有高风险参数数值（mJ / ℃ / μm / ft³ 等）
      if(isLead.value && text){
        return text.replace(/(\d+(\.\d+)?\s*(mJ|℃|μm|ft³|min|分钟)?)/g, (s)=> /(mJ|℃|μm|ft³)/.test(s) ? '（高风险参数已隐藏）' : s );
      }
      return text;
    }
    function scroll(){ nextTick(()=>{ if(chat.value) chat.value.scrollTop = chat.value.scrollHeight; }); }

    function setRisk(r){ store.lastRisk = r||'低'; }

    function send(){
      const text = input.value.trim(); if(!text) return;
      store.messages.push({ r:'user', t:text });
      input.value='';
      // 兜底：知识库零命中 —— 不生成任何推测性回答，只给提示 + 转人工 / 重新提问
      if(isNoMatchQuery(text)){
        store.messages.push({ r:'nomatch', q:text });
        scroll();
        return;
      }
      const reply = generateReply(text);
      store.messages.push(reply);
      addAudit(text, reply.t, reply.risk, reply.guard, reply.doc||'—', ctxStr());
      setRisk(reply.risk);
      scroll();
    }

    function generateReply(text){
      // 简化意图识别：填充上下文 + 风险 + 护栏
      const proc = (text.match(/Array|CF|Cell/i)||[])[0];
      const prod = (text.match(/P55|M32/i)||[])[0];
      const defect = (text.match(/Mura|亮点|暗斑|断线|色偏/i)||[])[0];
      if(proc) store.context.process = proc;
      if(prod) store.context.product = prod;
      if(defect) store.context.defect = defect;

      // 护栏命中：曝光能量 / 烤箱温度 超限
      if(/曝光能量/.test(text) && /31|30|超/.test(text)){
        setRisk('高');
        const m = { r:'bot', t:'检测到高风险参数：曝光能量已超硬上限 28 mJ，触发护栏拦截，禁止输出放行数值，需走 ECN 复核流程。', risk:'高', guard:true,
          params:[{name:'曝光能量',value:'（已拦截）',limit:'≤28 mJ',over:true}], doc:'D-WIN-01 v2.1' };
        return m;
      }
      if(/烤箱温度/.test(text) && /24|超|高/.test(text)){
        setRisk('高');
        return { r:'bot', t:'检测到烤箱温度超上限 235℃，触发护栏拦截，禁止输出放行数值，需停线复核。', risk:'高', guard:true,
          params:[{name:'烤箱温度',value:'（已拦截）',limit:'≤235℃',over:true}], doc:'D-WIN-02 v1.9' };
      }
      if(/复合|耦合|同时|多项/.test(text)){
        setRisk('高');
        const o = createWorkOrder({ source:'系统复合异常', reporter:'RAG系统', reporterRole:'系统', summary:text.slice(0,40)+'（复合异常）', risk:'高', priority:'紧急' });
        wecomPush(['工程师群','主管群'],'【复合异常工单】'+o.id,'系统识别复合耦合异常，已直推主管介入池，双向并行处理。', o.id);
        store.messages.push({ r:'system', t:'系统已自动生成工单 '+o.id+' 并模拟推送「工程师群 + 主管群」双向并行处理。' });
        return { r:'bot', t:'识别为多因素复合耦合异常，按规则不强行推理，已自动触发人工工单流程（工单 '+o.id+'）。', risk:'高', doc:'D-CASE-03' };
      }
      if(defect){
        setRisk('中');
        return { r:'bot', t:'已记录不良「'+defect+'」。建议查阅对应处置卡与案例库；如涉及高风险参数请补充实测值以便护栏校验。', risk:'中', doc:'D-EXP-01' };
      }
      if(!hasCtx.value){
        setRisk('低');
        return { r:'bot', t:'为精准定位，请补充：① 所属制程？② 产品型号？③ 具体不良现象？', risk:'低' };
      }
      setRisk('低');
      return { r:'bot', t:'已基于上下文（'+ctxStr()+'）检索知识库，未命中高风险项，可继续追问或提交求助工单。', risk:'低', doc:'—' };
    }

    function ctxStr(){ return [store.context.process,store.context.product,store.context.defect].filter(Boolean).join(' / ')||'—'; }

    function clearCtx(){ clearContext(true); store.messages.push({ r:'system', t:'上下文已手动清空（制程/产品/不良缓存）。' }); }

    function stopStream(){ if(streamTimer){ clearTimeout(streamTimer); streamTimer=null; } }
    function emitAutoOrder(c){
      const o = createWorkOrder({ source:'系统复合异常', reporter:'RAG系统', reporterRole:'系统', summary:'CF M32 烤箱温度+膜厚+色偏耦合漂移', risk:'高', priority:'紧急' });
      wecomPush(['工程师群','主管群'],'【复合异常工单】'+o.id,'系统识别复合耦合异常，已直推主管介入池，双向并行处理。', o.id);
    }
    function pushNext(){
      if(!streamCase) return;
      if(streamCase.idx >= streamCase.c.msgs.length){ streaming.value=false; streamCase=null; streamTimer=null; return; }
      const m = { ...streamCase.c.msgs[streamCase.idx] };
      store.messages.push(m);
      if(m.r==='bot' && m.risk) setRisk(m.risk);
      if(m.r==='system' && streamCase.c.autoOrder && !streamCase.done){ streamCase.done=true; emitAutoOrder(streamCase.c); }
      scroll();
      streamCase.idx++;
      streamTimer = setTimeout(pushNext, 850);
    }
    function playCase(id){
      stopStream();
      const c = CASE_SCRIPTS[id];
      streamCase = { c, idx:0, done:false };
      store.messages = []; store.context={process:'',product:'',defect:''}; setRisk('低');
      streaming.value = true;
      pushNext();
      EP.ElMessage({ type:'info', message:'正在流式载入：'+c.name+'（可点「跳过流式输出」一次性加载）' });
    }
    function skipStream(){
      if(!streamCase) return;
      stopStream();
      while(streamCase.idx < streamCase.c.msgs.length){
        const m = { ...streamCase.c.msgs[streamCase.idx] };
        store.messages.push(m);
        if(m.r==='bot' && m.risk) setRisk(m.risk);
        if(m.r==='system' && streamCase.c.autoOrder && !streamCase.done){ streamCase.done=true; emitAutoOrder(streamCase.c); }
        streamCase.idx++;
      }
      streaming.value=false; streamCase=null;
      scroll();
    }

    function archiveSession(){
      if(!store.messages.length){ EP.ElMessage.warning('当前没有可存档的会话'); return; }
      const id = 'S-'+Math.floor(Math.random()*9000+1000);
      const title = store.currentSessionTitle || ('会话 '+id);
      store.sessions.unshift({ id, title, time:now(), risk:store.lastRisk, status:'已存档', orderTag:'' });
      EP.ElMessage.success('会话已存档：'+id);
    }

    function openHelp(){ help.noMatch=false; helpVisible.value=true; }
    // 兜底气泡「转人工咨询」：带入原始提问，标记提交时打「知识库未命中」标签
    function openHelpFromNoMatch(q){
      help.summary = q || '';
      help.noMatch = true;
      helpVisible.value = true;
    }
    // 兜底气泡「重新提问」：只清空输入框，不改动输入框本身与既有逻辑
    function reAsk(){
      input.value='';
      EP.ElMessage.info('输入框已清空，可补充制程 / 产品 / 不良现象后重新提问');
    }
    function submitHelp(){
      if(!help.summary){ EP.ElMessage.warning('请填写问题摘要'); return; }
      const o = createWorkOrder({ source:'人工求助', summary:help.summary, session:help.session, urgent:help.urgent, risk:help.urgent?'高':'中', priority:help.urgent?'紧急':'中' });
      if(help.noMatch){
        o.tags.push('知识库未命中');
        o.timeline.push({ t:now(), e:'来源：智能问答「无可信检索来源」兜底转人工，已带入原始提问' });
      }
      if(!help.urgent){
        const night = store.simNight||isNight();
        if(night && store.user.role==='team_lead'){
          wecomPush(['本人'],'夜间提交提示','当前为工艺工程师非在岗时段，工单已登记，将在次日上班后统一安排处理；紧急重大良率事故请走现场电话应急通道。');
        }
      }
      helpVisible.value=false; help.summary=''; help.session=''; help.urgent=false; help.noMatch=false;
      EP.ElMessage.success('工单已提交：'+o.id+(o.tags.includes('夜间上报')?'（已打夜间上报）':''));
    }

    function simCtxTimeout(){ clearContext(false); }
    function simLoginTimeout(){ logout('模拟登录超时：60 分钟无操作已强制登出'); }

    return { input, chat, helpVisible, help, cases, hasCtx, riskColor, riskText, isNight, isLead, mask, streaming, send, clearCtx, playCase, skipStream, archiveSession, openHelp, openHelpFromNoMatch, reAsk, submitHelp, simCtxTimeout, simLoginTimeout, store };
  }
};

const DashboardPage = {

      <div class="wb-stat wb-stat-link" role="button" tabindex="0" :aria-label="'待主管介入 '+metrics.pendingSupervisor+' 条，点击进入工单池'" @click="goPool('2')" @keyup.enter="goPool('2')" @keyup.space.prevent="goPool('2')">

      </div>
      <div class="wb-stat wb-stat-link" role="button" tabindex="0" :aria-label="'超时工单 '+metrics.overdue+' 条，点击进入工单池'" @click="goPool('overdue')" @keyup.enter="goPool('overdue')" @keyup.space.prevent="goPool('overdue')">
        <div class="n" style="color:var(--wb-yellow)">{{metrics.overdue}}</div><div class="l">超时工单</div>
      </div>
      <div class="wb-stat wb-stat-link" role="button" tabindex="0" :aria-label="'紧急工单 '+metrics.urgent+' 条，点击进入工单池'" @click="goPool('urgent')" @keyup.enter="goPool('urgent')" @keyup.space.prevent="goPool('urgent')">
        <div class="n" style="color:var(--wb-red)">{{metrics.urgent}}</div><div class="l">紧急工单</div>
      </div>
    </div>

    <div class="wb-chart">
      <div class="wb-chart-head">
        <div style="font-weight:700;font-size:14px;">工单提报趋势</div>
        <div class="wb-mini">按提报日期汇总 · 最近 {{trend.length}} 个有工单的日期（演示数据）</div>
      </div>
      <div class="wb-chart-bars">
        <div class="wb-chart-col" v-for="t in trend" :key="t.date" :title="t.date+'：'+t.n+' 单'">
          <div class="wb-chart-val">{{t.n}}</div>
          <div class="wb-chart-bar" :style="{height:barH(t.n)}"></div>
        </div>
      </div>
      <div class="wb-chart-axis">
        <span class="wb-chart-x" v-for="t in trend" :key="t.date">{{t.date}}</span>
      </div>
      <div class="wb-tip" style="margin-top:12px;">统计口径：工单总量 = 全部状态；超时工单 = 未闭环且倒计时归零；紧急工单 = 含紧急标签或优先级为紧急。看板仅做统计呈现，工单承接请在【工单池】完成。</div>
    </div>
  </div>`,
  setup(){
    const metrics = computed(()=>({
      total: store.orders.length,
      pendingEngineer: store.orders.filter(o=>o.status==='pending_engineer').length,
      pendingSupervisor: store.orders.filter(o=>o.status==='pending_supervisor').length,
      overdue: store.orders.filter(o=>o.status!=='closed' && orderCountdown(o,store.nowTs).cls==='timeout').length,
      urgent: store.orders.filter(o=>o.tags.some(t=>t.indexOf('紧急')>=0)||o.priority==='紧急').length
    }));
    const trend = computed(()=>{
      const map={};
      store.orders.forEach(o=>{
        const m=String(o.created||'').match(/(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);
        if(!m) return;
        const k=m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
        map[k]=(map[k]||0)+1;
      });
      return Object.keys(map).sort().slice(-7).map(k=>({date:k.slice(5),n:map[k]}));
    });
    const maxN = computed(()=> Math.max(1, ...trend.value.map(t=>t.n)));
    function barH(n){ return Math.max(4, Math.round(n/maxN.value*80))+'%'; }
    function goPool(tab){
      store.poolTab = tab;
      if(store.currentPage!=='myorders'){ store.history.push(store.currentPage); store.currentPage='myorders'; }
      const names={ all:'全部', '1':'待处理', '2':'待主管介入', overdue:'已超时', urgent:'紧急工单' };
      EP.ElMessage.info('已跳转【工单池】· '+(names[tab]||''));
    }
    return { store, metrics, trend, barH, goPool };
  }
};

  setup(){

    const hlId=ref('');

    const isLead = computed(()=> store.user.role==='team_lead');
    const canAct = computed(()=> !isLead.value);   // 班组长不可接单/闭环/转派
    // 工单池 Tab：标签与【我的工单】逐字一致（7 个）；主管在「待处理」后额外保留「待主管介入」
    // 内部 name 沿用看板指标卡 / 「去查看」的跳转映射，改名不影响跨页联动
    const commonTabs = [
      {name:'all',label:'全部'},
      {name:'1',label:'待处理'},
      {name:'processing',label:'处理中'},
      {name:'3',label:'已闭环'},
      {name:'overdue',label:'已超时'},
      {name:'night',label:'夜间工单'},
      {name:'urgent',label:'紧急工单'}
    ];
    const tabs = computed(()=> isSup.value
      ? [...commonTabs.slice(0,2), {name:'2',label:'待主管介入'}, ...commonTabs.slice(2)]
      : commonTabs.slice());
    // 看板指标卡 / 「去查看」跳转：poolTab 为一次性目标，进入后立即清空；目标 Tab 对当前角色不可见时回落到默认 Tab
    watch(()=>store.poolTab, (v)=>{ if(v){ filter.value = tabs.value.some(t=>t.name===v) ? v : (isSup.value ? '2' : '1'); store.poolTab=''; } }, {immediate:true});
    // 防越权：工程师不可落入「待主管介入」Tab
    watch(filter, (v)=>{ if(!tabs.value.some(t=>t.name===v)) filter.value = isSup.value ? '2' : '1'; });
    // 切换 Tab / 下拉筛选后回到第 1 页
    watch([filter, priFilter, tagFilter], ()=>{ page.value = 1; });
    const filtered = computed(()=>{
      if(!store.user) return [];
      let list;
      switch(filter.value){
        case '1': list=store.orders.filter(o=>o.status==='pending_engineer'); break;
        case '2': list=store.orders.filter(o=>o.status==='pending_supervisor'); break;
        case '3': list=store.orders.filter(o=>o.status==='closed'); break;
        case 'processing': list=store.orders.filter(o=>o.status==='processing'); break;
        case 'night': list=store.orders.filter(o=>o.tags.some(t=>t.indexOf('夜间')>=0)); break;
        case 'overdue': list=store.orders.filter(o=>o.status!=='closed' && orderCountdown(o,store.nowTs).cls==='timeout'); break;
        case 'urgent': list=store.orders.filter(o=>o.tags.some(t=>t.indexOf('紧急')>=0)||o.priority==='紧急'); break;
        default: list=store.orders.slice();
      }
      // Tab 行右侧下拉：在当前 Tab 视图内二次叠加过滤（切换 Tab 时下拉值保留）
      if(priFilter.value) list=list.filter(o=>o.priority===priFilter.value);
      if(tagFilter.value) list=list.filter(o=>o.tags.some(t=>t.indexOf(tagFilter.value)>=0));
      return sorted(list, 'pool', 'created');   // 默认提交时间倒序，点击表头三角切正序
    });
    const paged = computed(()=> filtered.value.slice((page.value-1)*pageSize.value, page.value*pageSize.value));
    const totalPages = computed(()=> Math.max(1, Math.ceil(filtered.value.length/pageSize.value)));
    function onPageChange(v){ page.value = v; }
    function onSizeChange(sz){ pageSize.value = sz; page.value = 1; }
    // 列表变短（承接 / 闭环 / 筛选）时把页码收回有效范围
    watch(totalPages, (p)=>{ if(page.value>p) page.value=p; });

    function resetFilters(){ priFilter.value=''; tagFilter.value=''; }   // 重置：只清两个下拉，不改变当前 Tab
    function riskCls(r){ return r==='高'?'tag-high':r==='中'?'tag-mid':'tag-low'; }
    function statusText(s){ return ({pending_engineer:'待工程师承接',pending_supervisor:'待主管介入',processing:'处理中',closed:'已闭环'})[s]||s; }
    function statusType(s){ return s==='closed'?'success':(s==='processing'?'':'warning'); }
    function tagType(t){ if(t.indexOf('紧急')>=0) return 'danger'; if(t.indexOf('夜间')>=0) return 'info'; if(t.indexOf('复合')>=0||t.indexOf('超时')>=0) return 'warning'; return ''; }

    function convFor(id){ return getSessionMessages(id)!=null; }
    function openConv(id){ convSession.value=id; convMsgs.value=getSessionMessages(id); convOpen.value=true; }

    function closeOrder(o){ o.status='closed'; o.closed=now(); o.timeline.push({t:now(),e:store.user.name+' 填写结论并闭环'}); dv.value=false; EP.ElMessage.success('工单已闭环 '+o.id); }
    function escalate(o){ o.status='pending_supervisor'; o.timeline.push({t:now(),e:store.user.name+' 升级至主管介入池'}); wecomPush(['主管群'],'工单升级 '+o.id,o.summary+' 已升级，请主管介入。', o.id); EP.ElMessage.warning('已升级 '+o.id); }
    function transfer(o){ tv.value=true; cur.value=o; }
    function doTransfer(){ if(!transferTo.value){EP.ElMessage.warning('请选择工程师');return;} cur.value.status='processing'; cur.value.handler=transferTo.value; cur.value.tags=cur.value.tags.filter(t=>t!=='升级'); cur.value.deadline=deadlineIn(store.dayNight.dayTimeout); cur.value.deadlineTs=Date.now()+store.dayNight.dayTimeout*60000; cur.value.timeline.push({t:now(),e:'主管转办指派给 '+transferTo.value+'，重置30分钟倒计时'}); tv.value=false; EP.ElMessage.success('已转办给 '+transferTo.value); }
    function canTake(o){ return canAct.value && (o.status==='pending_engineer' || (isSup.value && o.status==='pending_supervisor')); }
    function takeLabel(o){ return o.status==='pending_supervisor' ? '抢单' : '接单'; }
    function take(o){
      const wasSup = o.status==='pending_supervisor';
      o.status='processing'; o.handler=store.user.name;
      o.deadline=deadlineIn(store.dayNight.dayTimeout); o.deadlineTs=Date.now()+store.dayNight.dayTimeout*60000;
      o.timeline.push({t:now(), e:(wasSup?'主管 ':'')+store.user.name+' 承接工单，进入处理中'});
      EP.ElMessage.success('已承接 '+o.id+'，已自动进入【我的工单】');
    }
    function demoTimeout(){
      const o = store.orders.find(x=>x.status==='pending_engineer');
      if(!o){ EP.ElMessage.info('当前无待承接工单可演示超时'); return; }
      if(store.simNight||isNightNow()){ EP.ElMessage.info('夜间：'+o.id+' 暂停超时，不自动升级、不夜间打扰'); }
      else { o.status='pending_supervisor'; o.tags.push('超时升级'); o.timeline.push({t:now(),e:'30分钟未接单，自动升级至主管介入池'}); wecomPush(['主管群'],'超时升级 '+o.id,o.summary+' 超时未接单，已推送主管。',o.id); EP.ElMessage.warning('已自动升级 '+o.id); }
    }
    function demoBatch(){
      const nightOrders = store.orders.filter(o=>o.tags.includes('夜间上报') && o.status==='pending_engineer');
      if(!nightOrders.length){ EP.ElMessage.info('当前无夜间积压工单'); return; }
      nightOrders.forEach(o=>{ o.tags.push('夜间积压·白班优先处理'); o.timeline.push({t:now(),e:'次日 '+store.dayNight.batchPush+' 批量推送主管'}); });
      wecomPush(['主管群'],'夜间积压批量推送', nightOrders.length+' 条夜间工单已批量推送，请白班优先处理。');
      EP.ElMessage.success('已批量推送 '+nightOrders.length+' 条夜间工单');
    }
    function newHelp(){ store.currentPage='qa'; EP.ElMessage.info('请前往「智能问答」页提交人工求助工单'); }

    return { store, filter, tabs, page, pageSize, paged, onPageChange, onSizeChange, take, canTake, takeLabel, demoTimeout, demoBatch, newHelp, priFilter, tagFilter, resetFilters, dv, cur, tv, transferTo, commentText, convOpen, convSession, convMsgs, hlId, isSup, isLead, canAct, filtered, riskCls, statusText, statusType, tagType, td, planDeadline, convFor, openConv, rowCls, maskSummary, openDetail, accept, closeOrder, escalate, transfer, doTransfer, addComment };
  }
};

          <el-option label="良率异常" value="良率异常"/><el-option label="复检" value="复检"/><el-option label="夜间上报" value="夜间上报"/>

    <el-table :data="filtered" border style="width:100%" :row-class-name="rowCls">

      <el-table-column label="问题摘要" min-width="170"><template #default="{row}">{{maskSummary(row)}}</template></el-table-column>
      <el-table-column prop="priority" label="优先级" width="68" />
      <el-table-column label="当前处理角色" width="94"><template #default="{row}">{{row.handler||'待分配'}}</template></el-table-column>
      <el-table-column label="工单状态" width="98"><template #default="{row}"><el-tag size="small" :type="statusType(row.status)">{{statusText(row.status)}}</el-tag></template></el-table-column>
      <el-table-column label="超时倒计时" width="170">
        <template #default="{row}">
          <el-tag size="small" :type="td(row).tagType" :class="{'wb-blink':td(row).blink}">{{td(row).tagText}}</el-tag>
          <div class="wb-mini" v-if="td(row).aux" style="margin-top:2px;">{{td(row).aux}}</div>
        </template>
      </el-table-column>
      <el-table-column label="标签" width="132"><template #default="{row}"><el-tag v-for="t in row.tags" :key="t" size="small" :type="tagType(t)" style="margin-right:4px;margin-bottom:2px;">{{t}}</el-tag></template></el-table-column>
      <el-table-column label="操作" width="76"><template #default="{row}"><el-button size="small" @click="openDetail(row)">详情</el-button></template></el-table-column>
    </el-table>
    <el-empty v-if="!filtered.length" description="当前筛选条件下暂无工单" />

    <el-dialog v-model="dv" :title="(cur?cur.id:'')+' 工单详情'" width="680px">
      <template v-if="cur">
        <el-descriptions :column="2" border>
          <el-descriptions-item label="来源">{{cur.source}}</el-descriptions-item>
          <el-descriptions-item label="提报人">{{cur.reporter}}（{{cur.reporterRole}}）</el-descriptions-item>
          <el-descriptions-item label="优先级">{{cur.priority}}</el-descriptions-item>
          <el-descriptions-item label="风险"><span :class="riskCls(cur.risk)">{{cur.risk}}</span></el-descriptions-item>
          <el-descriptions-item label="工单状态">{{statusText(cur.status)}}</el-descriptions-item>
          <el-descriptions-item label="当前处理角色">{{cur.handler||'待分配'}}</el-descriptions-item>
          <el-descriptions-item label="工单创建时间">{{cur.created}}</el-descriptions-item>
          <el-descriptions-item label="计划超时截止时间">{{planDeadline(cur)}}</el-descriptions-item>
          <el-descriptions-item label="超时倒计时" :span="2">
            <el-tag size="small" :type="td(cur).tagType" :class="{'wb-blink':td(cur).blink}">{{td(cur).tagText}}</el-tag>
            <span class="wb-mini" v-if="td(cur).aux" style="margin-left:6px;">{{td(cur).aux}}</span>
          </el-descriptions-item>
        </el-descriptions>

        <div style="font-weight:700;margin:12px 0 4px;display:flex;align-items:center;gap:10px;">
          <span>问题摘要</span>
          <el-button v-if="cur.session && convFor(cur.session)" size="small" type="primary" plain @click="openConv(cur.session)">查看原对话</el-button>
          <span v-else-if="cur.session" class="wb-mini">（该会话无存档对话）</span>
          <span v-else class="wb-mini">（现场提报工单，无关联会话）</span>
        </div>
        <div class="wb-mini">{{maskSummary(cur)}}</div>

        <div class="wb-tip" style="margin:10px 0 0;">超时流转规则：日间工单 30 分钟未接单自动升级至主管介入池；夜间普通工单暂停计时，次日 08:10 恢复；紧急工单穿透即时推送，30 分钟超时正常执行。</div>

        <div style="font-weight:700;margin:12px 0 4px;">流转时间线</div>
        <el-timeline style="padding-left:6px;">
          <el-timeline-item v-for="(t,i) in cur.timeline" :key="i" :timestamp="t.t" placement="top">{{t.e}}</el-timeline-item>
        </el-timeline>

        <div style="font-weight:700;margin:12px 0 4px;">留言记录</div>
        <div v-if="!cur.comments.length" class="wb-mini">暂无留言</div>
        <div v-for="(c,i) in cur.comments" :key="i" style="background:#f7f9fc;border:1px solid var(--wb-line);border-radius:6px;padding:8px 10px;margin-bottom:6px;">
          <div class="wb-mini">{{c.who}} · {{c.time}}</div>
          <div style="font-size:13px;margin-top:2px;">{{c.text}}</div>
        </div>

        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;" v-if="canAct">
          <el-button size="small" type="primary" @click="accept(cur)" :disabled="cur.status!=='pending_engineer'">接单</el-button>
          <el-button size="small" type="success" @click="closeOrder(cur)">填写结论并闭环</el-button>
          <el-button size="small" type="warning" @click="escalate(cur)">升级主管</el-button>
          <el-button size="small" v-if="isSup" type="primary" plain @click="transfer(cur)">转办指派</el-button>
        </div>
        <div v-else class="wb-tip" style="margin-top:8px;">当前角色仅可追加留言，无法接单 / 闭环 / 转派（工单内容已脱敏）。</div>
        <div style="margin-top:10px;">
          <el-input v-model="commentText" type="textarea" :rows="2" placeholder="追加留言说明（所有角色均可）" />
          <el-button size="small" style="margin-top:6px;" @click="addComment">追加留言</el-button>
        </div>
      </template>
      <template #footer><el-button @click="dv=false">关闭</el-button></template>
    </el-dialog>

    <el-dialog v-model="convOpen" :title="'原对话记录 · '+(convSession||'')" width="640px">
      <div v-if="convMsgs" style="max-height:440px;overflow:auto;padding:4px;">
        <div v-for="(m,i) in convMsgs" :key="i" class="wb-bubble" :class="m.r" style="max-width:88%;margin-bottom:10px;">{{m.t}}</div>
      </div>
      <div v-else class="wb-mini">该会话暂无存档对话内容。</div>
      <template #footer><el-button @click="convOpen=false">关闭</el-button></template>
    </el-dialog>

    <el-dialog v-model="tv" title="转办指派给工程师" width="420px">
      <el-select v-model="transferTo" placeholder="选择在岗工程师" style="width:100%;">
        <el-option label="李工程师（Array）" value="李工程师"/>
        <el-option label="周工程师（CF）" value="周工程师"/>
        <el-option label="吴工程师（Cell）" value="吴工程师"/>
      </el-select>
      <template #footer><el-button @click="tv=false">取消</el-button><el-button type="primary" @click="doTransfer">确认转办</el-button></template>
    </el-dialog>
  </div>`,
  setup(){
    const filter=ref('全部');
    const priFilter=ref(''); const tagFilter=ref('');   // Tab 行右侧叠加筛选（默认空=全部）
    const dv=ref(false); const cur=ref(null);
    const tv=ref(false); const transferTo=ref(''); const commentText=ref('');
    const convOpen=ref(false); const convSession=ref(''); const convMsgs=ref(null);
    const hlId=ref('');
    const isSup = computed(()=> store.user.role==='supervisor');
    const isLead = computed(()=> store.user.role==='team_lead');
    const canAct = computed(()=> !isLead.value);   // 班组长不可接单/闭环/转派
    const filtered = computed(()=>{
      if(!store.user) return [];
      let list = store.orders.filter(o=> isMine(o, store.user));
      switch(filter.value){
        case '待处理': list=list.filter(o=>o.status==='pending_engineer'||o.status==='pending_supervisor'); break;
        case '处理中': list=list.filter(o=>o.status==='processing'); break;
        case '已闭环': list=list.filter(o=>o.status==='closed'); break;
        case '已超时': list=list.filter(o=>o.status!=='closed' && orderCountdown(o,store.nowTs).cls==='timeout'); break;
        case '夜间工单': list=list.filter(o=>o.tags.some(t=>t.indexOf('夜间')>=0)); break;
        // 紧急工单：仅在个人归属范围内过滤，不引入公共待分配工单
        case '紧急工单': list=list.filter(o=>o.tags.some(t=>t.indexOf('紧急')>=0)||o.priority==='紧急'); break;
      }
      // Tab 行右侧下拉：在当前 Tab 视图内二次叠加过滤（切换 Tab 时下拉值保留）
      if(priFilter.value) list=list.filter(o=>o.priority===priFilter.value);
      if(tagFilter.value) list=list.filter(o=>o.tags.some(t=>t.indexOf(tagFilter.value)>=0));
      return sorted(list, 'mine', 'created');   // 默认提交时间倒序，点击表头三角切正序
    });
    watch(()=>store.highlightOrder, (v)=>{ if(v){ filter.value='全部'; priFilter.value=''; tagFilter.value=''; hlId.value=v; setTimeout(()=>{ hlId.value=''; store.highlightOrder=''; }, 6000); } });  // 去查看：回全部视图并清空下拉，确保目标工单可见
    function resetFilters(){ priFilter.value=''; tagFilter.value=''; }   // 重置：只清两个下拉，不改变当前 Tab
    function riskCls(r){ return r==='高'?'tag-high':r==='中'?'tag-mid':'tag-low'; }
    function statusText(s){ return ({pending_engineer:'待工程师承接',pending_supervisor:'待主管介入',processing:'处理中',closed:'已闭环'})[s]||s; }
    function statusType(s){ return s==='closed'?'success':(s==='processing'?'':'warning'); }
    function tagType(t){ if(t.indexOf('紧急')>=0) return 'danger'; if(t.indexOf('夜间')>=0) return 'info'; if(t.indexOf('复合')>=0||t.indexOf('超时')>=0) return 'warning'; return ''; }
    function td(o){ return timeoutDisplay(o, store.nowTs); }
    function planDeadline(o){ if(o.tags.indexOf('夜间上报')>=0 && o.status!=='closed') return '次日 08:10 恢复计时'; return fmtTs(o.deadlineTs!=null?o.deadlineTs:parseDeadline(o.deadline)); }
    function convFor(id){ return getSessionMessages(id)!=null; }
    function openConv(id){ convSession.value=id; convMsgs.value=getSessionMessages(id); convOpen.value=true; }
    function rowCls({row}){ return row.id===hlId.value ? 'wb-row-hl' : ''; }
    function maskSummary(o){ if(isLead.value){ return (o.summary||'').replace(/(\d+(\.\d+)?\s*(mJ|℃|μm|ft³))/g,'（高风险参数已隐藏）'); } return o.summary; }
    function openDetail(o){ cur.value=o; commentText.value=''; dv.value=true; }
    function accept(o){ o.status='processing'; o.handler=store.user.name; o.deadline=deadlineIn(store.dayNight.dayTimeout); o.deadlineTs=Date.now()+store.dayNight.dayTimeout*60000; o.timeline.push({t:now(),e:store.user.name+' 接单，进入处理中'}); EP.ElMessage.success('已接单 '+o.id); }
    function closeOrder(o){ o.status='closed'; o.closed=now(); o.timeline.push({t:now(),e:store.user.name+' 填写结论并闭环'}); dv.value=false; EP.ElMessage.success('工单已闭环 '+o.id); }
    function escalate(o){ o.status='pending_supervisor'; o.timeline.push({t:now(),e:store.user.name+' 升级至主管介入池'}); wecomPush(['主管群'],'工单升级 '+o.id,o.summary+' 已升级，请主管介入。', o.id); EP.ElMessage.warning('已升级 '+o.id); }
    function transfer(o){ tv.value=true; cur.value=o; }
    function doTransfer(){ if(!transferTo.value){EP.ElMessage.warning('请选择工程师');return;} cur.value.status='processing'; cur.value.handler=transferTo.value; cur.value.tags=cur.value.tags.filter(t=>t!=='升级'); cur.value.deadline=deadlineIn(store.dayNight.dayTimeout); cur.value.deadlineTs=Date.now()+store.dayNight.dayTimeout*60000; cur.value.timeline.push({t:now(),e:'主管转办指派给 '+transferTo.value+'，重置30分钟倒计时'}); tv.value=false; EP.ElMessage.success('已转办给 '+transferTo.value); }
    function addComment(){ if(!commentText.value){EP.ElMessage.warning('请输入留言');return;} cur.value.comments.push({time:now(), who:store.user.name+'('+ROLES[store.user.role].short+')', text:commentText.value}); commentText.value=''; EP.ElMessage.success('留言已追加'); }
    return { store, filter, priFilter, tagFilter, resetFilters, dv, cur, tv, transferTo, commentText, convOpen, convSession, convMsgs, hlId, isSup, isLead, canAct, filtered, riskCls, statusText, statusType, tagType, td, planDeadline, convFor, openConv, rowCls, maskSummary, openDetail, accept, closeOrder, escalate, transfer, doTransfer, addComment };
  }
};

/* ---- 根组件 ---- */
const App = {
  template:`
  <login-page v-if="!store.user" />
  <el-container v-else style="height:100vh;">
    <div class="wb-side-mask" v-if="store.isNarrow && !store.sidebarCollapsed" @click="toggleSide"></div>
    <el-aside :width="store.isNarrow ? '210px' : (store.sidebarCollapsed ? '64px' : '210px')" class="wb-side" :class="{ 'wb-side-open': store.isNarrow && !store.sidebarCollapsed }">
      <div class="wb-logo" v-if="!store.sidebarCollapsed || store.isNarrow">工艺智能问答 RAG</div>
      <div class="wb-logo wb-logo-mini" v-else>RAG</div>
      <el-menu :default-active="store.currentPage" :collapse="!store.isNarrow && store.sidebarCollapsed" :collapse-transition="false" background-color="transparent" text-color="#c7d2e4" active-text-color="#fff">
        <el-menu-item v-for="m in menu" :key="m.key" :index="m.key" @click="go(m.key)" :title="m.title">
          <el-icon><component :is="m.icon"/></el-icon><span>{{m.title}}</span>
        </el-menu-item>
      </el-menu>
    </el-aside>
    <el-container>
      <el-header class="wb-header">
        <div class="wb-head-left">
          <el-button size="small" circle @click="toggleSide" title="折叠 / 展开导航">
            <el-icon><component :is="'Menu'"/></el-icon>
          </el-button>
          <el-button size="small" :disabled="!canBack" @click="back" title="返回上一个页面">
            <el-icon><component :is="'ArrowLeft'"/></el-icon> 返回
          </el-button>
          <div class="wb-head-title">{{pageTitle}}</div>
          <el-breadcrumb separator="/" class="wb-crumb wb-hide-narrow">
            <el-breadcrumb-item v-for="(c,i) in crumbs" :key="i">
              <span v-if="i===crumbs.length-1" class="wb-crumb-cur">{{c.label}}</span>
              <a v-else href="javascript:void(0)" class="wb-crumb-link" @click="go(c.key)">{{c.label}}</a>
            </el-breadcrumb-item>
          </el-breadcrumb>
        </div>
        <div class="wb-head-right">
          <span class="wb-mini wb-hide-narrow">🕐 {{clock}}</span>
          <el-badge :value="alertCount" :hidden="alertCount===0" :max="99">
            <el-button size="small" circle @click="goAlert" title="待处理 / 即将超时工单提醒（点击进入工单池或我的工单）">
              <el-icon><component :is="'Bell'"/></el-icon>
            </el-button>
          </el-badge>
          <el-tag :color="roleColor" style="color:#fff;border:none;">{{store.user.roleLabel}}</el-tag>
          <span class="wb-mini wb-hide-narrow">{{store.user.name}}</span>
          <el-button size="small" text type="primary" @click="relogin">切换角色/登出</el-button>
        </div>
      </el-header>
      <el-main class="wb-main">
        <qa-page v-if="store.currentPage==='qa'"/>
        <archive-page v-else-if="store.currentPage==='archive'"/>
        <audit-page v-else-if="store.currentPage==='audit'"/>
        <doc-page v-else-if="store.currentPage==='docs'"/>
        <my-orders-page v-else-if="store.currentPage==='myorders'"/>
        <my-work-page v-else-if="store.currentPage==='mine'"/>
        <dashboard-page v-else-if="store.currentPage==='dashboard'"/>
        <eval-page v-else-if="store.currentPage==='eval'"/>
        <guard-page v-else-if="store.currentPage==='guard'"/>
      </el-main>
    </el-container>

    <!-- 企微推送模拟弹窗 -->
    <el-dialog v-model="store.wecom.visible" :title="'📲 企业微信推送模拟 · '+store.wecom.title" width="480px">
      <div style="background:#eaf3ff;border:1px solid #bcdcff;border-radius:8px;padding:12px;">
        <div class="wb-mini" style="margin-bottom:6px;">推送群组：<b>{{store.wecom.groups.join(' / ')}}</b></div>
        <div style="font-size:14px;line-height:1.7;">{{store.wecom.content}}</div>
      </div>
      <div class="wb-tip" style="margin-top:10px;">前端模拟推送，无需真实接口（企微 Webhook 演示）。</div>
      <template #footer>
        <el-button @click="store.wecom.visible=false">已知悉</el-button>
        <el-button type="primary" :disabled="!store.wecom.orderId" @click="goView">去查看</el-button>
      </template>
    </el-dialog>
  </el-container>`,
  setup(){
    const clock = ref(hhmm());
    const menu = computed(()=> MENU.filter(m=> canView(m.key)) );
    const pageTitle = computed(()=>{ const m=MENU.find(x=>x.key===store.currentPage); return m?m.title:''; });
    const roleColor = computed(()=> ROLES[store.user?store.user.role:'team_lead'].color );
    const alertCount = computed(()=>{
      if(!store.user) return 0;
      return store.orders.filter(o=> isMyOrder(o, store.user) && o.status!=='closed' &&
        (orderCountdown(o, store.nowTs).cls==='urgent' || orderCountdown(o, store.nowTs).cls==='timeout' ||
         o.status==='pending_engineer' || o.status==='pending_supervisor')).length;
    });
    function go(k){
      if(!canView(k) || k===store.currentPage) return;
      store.history.push(store.currentPage);   // 记录上一个页面，供「返回」回退
      store.currentPage = k;
    }
    const canBack = computed(()=> store.history.length>0 );
    const crumbs = computed(()=>{
      const list = [{ key:'qa', label:'首页' }];
      if(store.currentPage!=='qa') list.push({ key:store.currentPage, label:pageTitle.value });
      return list;
    });
    function back(){ if(store.history.length){ store.currentPage = store.history.pop(); } }   // 返回：仅路由回退，不撤销已提交数据
    function toggleSide(){ store.sidebarCollapsed = !store.sidebarCollapsed; }  // 顶部汉堡：折叠/展开侧栏
    function relogin(){ logout('已切换角色 / 登出'); }
    function goView(){
      const id=store.wecom.orderId; store.wecom.visible=false; store.highlightOrder=id;
      const o = store.orders.find(x=>x.id===id);
      if(o && isMine(o, store.user)){ go('mine'); return; }
      if(canView('myorders')){ store.poolTab = store.user.role==='supervisor' ? '2' : '1'; go('myorders'); }
      else go('mine');
    }
    function goAlert(){ go(canView('myorders') ? 'myorders' : 'mine'); }
    watch(()=>store.currentPage, ()=> resetTableSort());   // 进入任一页面：所有时间列恢复默认倒序
    let timer=null;
    function syncNarrow(){ const n = window.innerWidth<=1024; store.isNarrow=n; if(n) store.sidebarCollapsed=true; }  // 窄屏默认收起侧栏为抽屉
    onMounted(()=>{
      timer=setInterval(()=>{ clock.value=hhmm(); store.nowTs=Date.now(); }, 1000);
      syncNarrow();
      window.addEventListener('resize', syncNarrow);
    });
    onBeforeUnmount(()=>{ if(timer)clearInterval(timer); window.removeEventListener('resize', syncNarrow); stopTimers(); });
    return { store, menu, pageTitle, roleColor, alertCount, clock, go, back, toggleSide, canBack, crumbs, relogin, goView, goAlert };
  }
};

</script>
